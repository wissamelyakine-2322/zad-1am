name: Build Windows
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - name: Prepare app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/app | Out-Null
          Copy-Item -Recurse -Force www/* desktop/app/
          Copy-Item -Force res/icon.png desktop/build/icon.png
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: zad-windows
          path: desktop/dist/*.exe
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Zad dz - آخر إصدار
          files: |
            desktop/dist/ZadDz-Portable.exe
            desktop/dist/ZadDz-Setup.exe
          make_latest: true
