MM.push({s:1,i:'🎢',t:'دراسة دوال تحتوي ln و exp',
B:[['الخطوات',['المجال، النهايات، المقاربات','المشتق: عامل `e^x` أو `1/x` موجب غالبا','جدول التغيرات واستنتاج المقاربات']],
['نهايات تستعمل',['`ln x/x → 0` و `x·ln x → 0^-`','`e^x/x → +∞` و `x·e^{-x} → 0`']],
['مقاربات',['`f(x) = x + e^{-x}`: المقارب المائل `y = x` عند `+∞`','`ln x` قرب 0: مقارب عمودي `x = 0`']],
['كيف نبرهن؟',['إشارة المشتق: حلل إلى عوامل','عامل `e^x` موجب دائما','عامل `ln x` يتغير إشارته عند 1']]],
X:'دراسة هذه الدوال مثل غيرها، لكن النهايات تحتاج النهايات المرجعية. ومشتقاتها غالبا تحتوي عوامل موجبة (مثل `e^x` أو `1/x`) فتصبح إشارة المشتق من إشارة عامل بسيط.',
M:['استعمل `ln x/x` و `x ln x` عند الحاجة.','حلل المشتق إلى جداء عوامل.','لا تنس النهاية عند `0^+` عندما يكون ln حاضرا.'],
EX:[['ادرس `f(x) = ln x / x` على `]0 ; +∞[`.','عند `0^+`: `ln x → -∞` و `1/x → +∞` فالنهاية `-∞` والمقارب `x = 0`. عند `+∞`: 0 والمقارب `y = 0`. `f′(x) = (1 - ln x)/x^2`: موجبة على `]0 ; e[` وسالبة بعدها. القيمة العظمى `f(e) = 1/e`.'],['ادرس `f(x) = x - ln x` على `]0 ; +∞[`.','`f′(x) = 1 - 1/x = (x - 1)/x`: سالبة قبل 1 وموجبة بعده. الصغرى `f(1) = 1`. النهايات: `+∞` عند `0^+` (لأن `-ln x → +∞`) وعند `+∞` (لأن `x - ln x = x(1 - ln x/x)`).'],['ادرس `f(x) = x + e^{-x}` وبيّن أن `y = x` مقارب مائل عند `+∞`.','`f(x) - x = e^{-x} → 0` عند `+∞` فـ `y = x` مقارب مائل والمنحنى فوقه لأن `e^{-x} > 0`. `f′(x) = 1 - e^{-x}` تنعدم عند 0: سالبة قبله وموجبة بعده. الصغرى `f(0) = 1`.']],
K:'نهايات مرجعية + مشتق بعوامل موجبة + جدول تغيرات + مقاربات.'});

['كيف نبرهن أن f حل؟',['نشتق `f` ونتحقق أن `f′ = af + b`']]],
X:'معادلة تفاضلية معناها: معدل تغير الدالة يتناسب مع قيمتها. حلها دائما أسية: `Ce^{ax}`، بإضافة ثابت إذا كان هناك الحد b. والثابت C نحدده من القيمة الابتدائية.',

EX:[['حل `y′ = 2y + 4` مع `y(0) = 1`.','الحل العام `y = Ce^{2x} - 4/2 = Ce^{2x} - 2`. الشرط: `y(0) = C - 2 = 1` فـ `C = 3`. `y(x) = 3e^{2x} - 2`. تحقق: `y′ = 6e^{2x}` و `2y + 4 = 6e^{2x} - 4 + 4 = 6e^{2x}` ✓.'],['حل `y′ + 2y = 6` مع `y(0) = 0`.','نكتب `y′ = -2y + 6` فالحل العام `y = Ce^{-2x} + 3`. `y(0) = C + 3 = 0` فـ `C = -3`. `y(x) = 3 - 3e^{-2x}`.'],['درجة حرارة فنجان `T′ = -0.1(T - 20)` و `T(0) = 90`. أوجد `T(t)`.','`T′ = -0.1T + 2` فالحل `T = Ce^{-0.1t} + 20`. `T(0) = C + 20 = 90` فـ `C = 70`. `T(t) = 20 + 70e^{-0.1t}` وتؤول إلى 20 (حرارة الغرفة).']],

M:['اشتق الجواب للتأكد.','جرّب أن تتعرف على `u′` داخل العبارة.','للشرط الابتدائي استعمل `F(a) = b`.'],

MM.push({s:2,i:'∫',t:'التكامل وخواصه والتكامل بالتجزئة',
B:[['التعريف',['`∫_{a}^{b} f(x)dx = F(b) - F(a)`','F أي دالة أصلية لـ f','يرمز `[F(x)]_{a}^{b}` للفرق']],

['التكامل بالتجزئة',['`∫_{a}^{b} u·v′ = [u·v]_{a}^{b} - ∫_{a}^{b} u′·v`','نستعملها عند جداء كثير حدود في `e^x` أو `sin` أو `cos` أو عند `ln`']],
['كيف نختار u و v′؟',['كثير الحدود هو `u` (يبسط بالاشتقاق)','عند ln: `u = ln x` و `v′ = 1`']]],
X:'التكامل المحدد يعطي عددا يمثل مساحة (موجبة إذا كانت الدالة فوق المحور). نحسبه بالدالة الأصلية: القيمة عند الطرف الأعلى ناقص القيمة عند الأدنى. والتجزئة تحول تكاملا صعبا إلى آخر أبسط.',

['طبيعة مثلث',['الحاصل `±i`: قائم ومتساوي الساقين في A','الحاصل `e^{±iπ/3}`: متقايس الأضلاع']],
['مجموعات نقط',['`|z - ω| = R`: دائرة','`|z - a| = |z - b|`: محور القطعة','نكتب `z = x + iy` ونستخرج معادلة']]],
X:'اللغة المركبة تترجم الهندسة إلى جبر. المسافة هي طويلة الفرق، والزاوية هي عمدة حاصل قسمة. وإذا كان حاصل القسمة `(z_C - z_A)/(z_B - z_A)` حقيقيا فالنقط على استقامة، وإذا كان تخيليا صرفا فالمستقيمان متعامدان.',
M:['احسب `(z_C - z_A)/(z_B - z_A)` ثم حلله.','لمجموعة النقط: `z = x + iy` ثم ربّع الطويلة.'],
EX:[['`A(1)`, `B(2 + i)`, `C(i)`. ما طبيعة المثلث ABC؟','`(z_C - z_A)/(z_B - z_A) = (i - 1)/(1 + i) = (i - 1)(1 - i)/2 = 2i/2 = i`. فالطويلة 1 أي `AC = AB` والعمدة `π/2` أي `AB ⊥ AC`. المثلث قائم ومتساوي الساقين في A.'],['عيّن مجموعة النقط M(z) التي تحقق `|z - 1| = |z + i|`.','`(x - 1)^2 + y^2 = x^2 + (y + 1)^2` فـ `-2x + 1 = 2y + 1` أي `y = -x`. هي محور القطعة بين `A(1)` و `B(-i)`: المستقيم `y = -x`.'],['`A(0)`, `B(2)`, `C(1 + i√3)`. بيّن أن ABC متقايس الأضلاع.','`(z_C - z_A)/(z_B - z_A) = (1 + i√3)/2 = e^{iπ/3}` فالطويلة 1 والعمدة `π/3`. إذن `AC = AB` والزاوية `60°`، فالمثلث متقايس الأضلاع.'],['عيّن مجموعة النقط التي تحقق `|z - 2i| = 3`.','دائرة مركزها `Ω(0 ; 2)` ونصف قطرها 3.']],

['التحاكي',['`z′ - ω = k(z - ω)` مركزه `Ω(ω)` ونسبته `k`','`z′ = kz + (1-k)ω`']],

['التشابه المباشر',['`z′ = az + b` مع `a ≠ 0, 1`','النسبة `|a|` والزاوية `arg a`','المركز `ω = b/(1 - a)`']],
['كيف نبرهن؟',['نكتب العبارة المركبة من تعريف التحويل','نعوض z لإيجاد الصورة']]],
X:'كل تحويل نقطي يُكتب بعبارة مركبة بسيطة. الدوران ضرب في عدد طويلته 1، والتحاكي ضرب في عدد حقيقي، والتشابه المباشر ضرب في عدد مركب أي تحاك مع دوران.',
M:['حدد المركز من الثابت `ω = b/(1 - a)`.','`|a|` هي النسبة و `arg a` هي الزاوية.'],
EX:[['اكتب العبارة المركبة للدوران الذي مركزه `ω = 1` وزاويته `π/2` ثم أوجد صورة `M(3 + i)`.','`z′ - 1 = i(z - 1)` أي `z′ = i(z - 1) + 1`. من أجل `z = 3 + i`: `z′ = i(2 + i) + 1 = 2i - 1 + 1 = 2i`. الصورة `M′(2i)`.'],['حدد عناصر التشابه `z′ = (1 + i)z + 2`.','النسبة `|1 + i| = √2` والزاوية `π/4`. المركز `ω = 2/(1 - (1 + i)) = 2/(-i) = 2i`. تحقق: `(1 + i)(2i) + 2 = 2i - 2 + 2 = 2i` ✓.'],['اكتب العبارة المركبة للتحاكي الذي مركزه `1 + i` ونسبته 2 وأوجد صورة النقطة 3.','`z′ - (1 + i) = 2(z - (1 + i))` فـ `z′ = 2z - 1 - i`. من أجل `z = 3`: `z′ = 5 - i`.']],

['باقي قوة',['نبحث عن الدور: أول قوة تساوي 1','نكتب الأس `= q×(الدور) + r`','`a^{kq + r} ≡ a^r [n]`']],
['قابلية القسمة',['ندرس البواقي الممكنة في جدول','نستعمل `a ≡ ±1` لتبسيط القوى']],
['كيف نبرهن؟',['"ندرس البواقي الممكنة بترديد m: ..."','"في كل الحالات `A ≡ 0 [m]` إذن m يقسم A"']]],
X:'الموافقة تسمح لنا بالعمل مع البواقي فقط بدل الأعداد الضخمة. فبدل حساب `3^{2025}` نبحث عن دورة بواقي قوى 3: بعد 4 قوى تعود إلى 1، فيكفي أن نعرف الباقي عند قسمة 2025 على 4.',
M:['ابحث عن الدور (أول قوة ≡ 1).','عند البرهان على القابلية ادرس كل الحالات.','`a ≡ -1 [n]` يفيد في القوى الفردية.'],
EX:[['ما باقي قسمة `3^{2025}` على 10؟','قوى 3 بترديد 10: `3^1 ≡ 3` ، `3^2 ≡ 9` ، `3^3 ≡ 7` ، `3^4 ≡ 1`. الدور 4. `2025 = 4×506 + 1` فـ `3^{2025} = (3^4)^{506}·3 ≡ 3 [10]`. الباقي 3.'],['بيّن أن `n^3 - n` يقبل القسمة على 6.','`n^3 - n = (n - 1)n(n + 1)` جداء ثلاثة أعداد متتالية: أحدها زوجي وأحدها مضاعف للعدد 3. وبما أن 2 و 3 أوليان فيما بينهما فهو يقبل القسمة على 6.'],['بيّن أن 11 يقسم `10^{2n+1} + 1`.','`10 ≡ -1 [11]` فـ `10^{2n+1} ≡ (-1)^{2n+1} = -1 [11]`. إذن `10^{2n+1} + 1 ≡ 0 [11]`.'],['بيّن أن مربع كل عدد فردي يوافق 1 بترديد 8.','`n = 2k + 1` فـ `n^2 = 4k(k+1) + 1`. و `k(k+1)` زوجي فـ `4k(k+1)` مضاعف للعدد 8. إذن `n^2 ≡ 1 [8]`.']],

MM.push({s:5,i:'🧮',t:'القاسم المشترك الأكبر وخوارزمية إقليدس',
B:[['التعريف',['`PGCD(a ; b)` أكبر قاسم مشترك','`PGCD(a ; b) = PGCD(b ; r)` حيث r باقي قسمة a على b']],
['الخوارزمية',['نقسم a على b ثم b على الباقي ...','آخر باقي غير معدوم هو PGCD']],
['خواص',['`PGCD(ka ; kb) = k·PGCD(a ; b)`','a و b أوليان فيما بينهما ⇔ `PGCD = 1`','`a × b = PGCD × PPCM`']],
['كيف نبرهن؟',['قاسم مشترك لـ a و b يقسم `a - b` و `a + b`','لإثبات `PGCD = 1`: نبين أن القواسم المشتركة تقسم 1']]],
X:'خوارزمية إقليدس هي أسرع طريقة لإيجاد القاسم المشترك الأكبر: نكرر القسمة على الباقي حتى ينعدم الباقي، فيكون آخر باقي غير معدوم هو الجواب.',
M:['اكتب كل قسمة بصيغة `a = bq + r`.','احسب PPCM بالعلاقة `a·b = PGCD·PPCM`.'],
EX:[['احسب `PGCD(252 ; 198)` و `PPCM(252 ; 198)`.','`252 = 198 + 54` ثم `198 = 3×54 + 36` ثم `54 = 36 + 18` ثم `36 = 2×18 + 0`. آخر باقي غير معدوم 18 فـ `PGCD = 18`. `PPCM = 252×198/18 = 2772`.'],['بيّن أن `n` و `n + 1` أوليان فيما بينهما.','كل قاسم مشترك لـ n و `n + 1` يقسم الفرق `(n + 1) - n = 1`. إذن `PGCD = 1`.'],['احسب `PGCD(2n + 1 ; n)` من أجل `n ≥ 1`.','`2n + 1 = 2·n + 1`. الباقي 1 فـ `PGCD = PGCD(n ; 1) = 1`.']],
K:'PGCD(a,b) = PGCD(b,r). آخر باقي غير معدوم. a·b = PGCD·PPCM.'});
MM.push({s:5,i:'🧷',t:'مبرهنتا بيزو وغوص والمعادلة ax + by = c',

X:'مبرهنة بيزو تقول: إذا كان العددان أوليين فيما بينهما فيمكن تركيب العدد 1 منهما بمضاعفات صحيحة. وهذا يفتح الباب لحل المعادلات الديوفانتية وإيجاد مقلوب عدد بترديد معين.',

EX:[['حل في `ℤ^2` المعادلة `7x + 5y = 3`.','`PGCD(7 ; 5) = 1` يقسم 3 فالحلول موجودة. حل خاص: `7×(-6) + 5×9 = -42 + 45 = 3` أي `(x_0 ; y_0) = (-6 ; 9)`. بالطرح: `7(x + 6) = -5(y - 9)`. 5 يقسم `7(x + 6)` وهو أولي مع 7 فحسب غوص `5 | (x + 6)` أي `x = -6 + 5k` ثم `y = 9 - 7k` (`k ∈ ℤ`).'],['هل للمعادلة `3x + 6y = 5` حلول؟','`PGCD(3 ; 6) = 3` ولا يقسم 5. لا حلول.'],['أوجد `u` و `v` بحيث `5u + 17v = 1`.','`17 = 3×5 + 2` و `5 = 2×2 + 1`. فـ `1 = 5 - 2×2 = 5 - 2(17 - 3×5) = 7×5 - 2×17`. إذن `u = 7` و `v = -2`.'],['بيّن أنه إذا كان 7 يقسم `3k` فإن 7 يقسم `k`.','`PGCD(7 ; 3) = 1` فحسب مبرهنة غوص `7 | k`.']],

EX:[['ادرس `f(x) = (x - 1)e^{x}` على `ℝ`.','`f′(x) = e^{x} + (x - 1)e^{x} = x·e^{x}`. سالبة على `]-∞ ; 0]` وموجبة على `[0 ; +∞[`. `f(0) = -1` قيمة صغرى. عند `+∞` النهاية `+∞`. عند `-∞` نكتب `f(x) = x·e^{x} - e^{x} → 0` فالمستقيم `y = 0` مقارب أفقي. وتنعدم f عند `x = 1`.'],['ادرس `g(x) = x + e^{-x}` على `ℝ`.','`g′(x) = 1 - e^{-x}`. تنعدم عند `x = 0` وسالبة على `]-∞ ; 0]` وموجبة على `[0 ; +∞[`. القيمة الصغرى `g(0) = 1`. النهاية `+∞` عند طرفيها. `g(x) - x = e^{-x} → 0` عند `+∞` فالمستقيم `y = x` مقارب مائل. المنحنى فوقه لأن `e^{-x} > 0`.']],
K:'`e^{x} → 0` عند `-∞` و `x·e^{x} → 0` عند `-∞` و `e^{x}/x → +∞` عند `+∞`. مشتقة: `u′·e^{u}`.'});

K:'`x̄ = Σx_i/n` و `V(x) = Σx_i^{2}/n - x̄^{2}` و `cov(x,y) = Σx_i·y_i/n - x̄·ȳ`. النقطة المتوسطة `G(x̄ ; ȳ)`.'});
MG.push({s:5,i:'📈',t:'التعديل الخطي والارتباط والتقدير',
B:[['مستقيم الانحدار',['`y = a·x + b` (المربعات الصغرى)','`a = cov(x,y)/V(x)`','`b = ȳ - a·x̄`']],

X:'نبحث عن المستقيم الأقرب لكل النقاط معا. ميله a هو التغاير مقسوما على تباين x، ويمر دائما من النقطة المتوسطة. أما معامل الارتباط r فيقيس مدى التصاق النقاط بالمستقيم: قريب من 1 أو -1 يعني التعديل جيد.',

EX:[['باستعمال معطيات الإشهار (x̄=3، ȳ=6.2، V(x)=2، cov=3) أوجد معادلة مستقيم الانحدار وقدّر المبيعات عند `x = 7`.','`a = 3/2 = 1.5` و `b = 6.2 - 1.5×3 = 1.7`. المعادلة `y = 1.5x + 1.7`. عند `x = 7`: `y = 10.5 + 1.7 = 12.2` أي 12200 دج تقريبا.'],['ما النفقات اللازمة لبلوغ مبيعات قيمتها 20؟','نحل `1.5x + 1.7 = 20` فـ `x = 18.3/1.5 = 12.2` أي نحو 12200 دج من الإشهار.'],['احسب معامل الارتباط وفسّره.','`σ_x = √2 ≈ 1.414` و `σ_y ≈ 2.135`. `r = 3/(1.414×2.135) ≈ 0.994`. قريب جدا من 1 فالارتباط طردي وقوي والتعديل الخطي مناسب.']],

M:['اعدّ الحالات الممكنة أولا.','«على الأقل واحد» = 1 - «ولا واحد».','اكتب النتيجة كسرا مختصرا.'],
EX:[['كيس فيه 5 كرات حمراء و 3 زرقاء. نسحب كرتين في آن واحد. احسب احتمال أن تكونا حمراوين، وأن يكون لونهما مختلفا، وأن تكون واحدة زرقاء على الأقل.','عدد الحالات `C(8,2) = 28`. حمراوان: `C(5,2)/28 = 10/28 = 5/14`. مختلفان: `5×3/28 = 15/28`. على الأقل زرقاء: `1 - 10/28 = 18/28 = 9/14`.'],['كم لجنة من 3 أعضاء يمكن تشكيلها من 10 أشخاص؟','الترتيب غير مهم. `C(10,3) = 120` لجنة.'],['`P(A) = 0.5` و `P(B) = 0.4` و `P(A ∩ B) = 0.2`. احسب `P(A ∪ B)` و `P(Ā)`.','`P(A ∪ B) = 0.5 + 0.4 - 0.2 = 0.7`. و `P(Ā) = 1 - 0.5 = 0.5`.']],

const AM1={"math":{"name":"الرياضيات","c":"#1565c0","i":"➗","L":[{"t":"الأعداد الطبيعية والأعداد العشرية","bs":[["الأعداد الطبيعية",["0، 1، 2، 3، … تُستعمل في العدّ."]],["الفكرة الأساسية",["العدد العشري له فاصلة: مثل 14,27. جزؤه الصحيح 14 وجزؤه العشري 27."]],["الأرقام بعد الفاصلة",["الأعشار، ثم أجزاء المئة، ثم أجزاء الألف."]],["أمثلة",["مثال: في العدد 36,482 → الرقم 3 للعشرات، 6 للوحدات، 4 للأعشار، 8 لأجزاء المئة، 2 لأجزاء الألف."]],["الكسر العشري",["7/10 = 0,7 ؛ 25/100 = 0,25 ؛ 3/1000 = 0,003."]]],"k":"0، 1، 2، 3، … تُستعمل في العدّ."},{"t":"مقارنة الأعداد العشرية وترتيبها","bs":[["الفكرة الأساسية",["نقارن الجزء الصحيح أولًا، فإن تساوى نقارن الأرقام بعد الفاصلة من اليسار.","يمكن إضافة أصفار على يمين الجزء العشري دون تغيير القيمة: 2,5 = 2,50."]],["أمثلة",["مثال: رتّب تصاعديًا 4,09 ؛ 4,9 ؛ 3,99."]],["تطبيق",["الحل: نكتب 4,9 = 4,90. الجزء الصحيح: 3 < 4 فـ 3,99 هو الأصغر. ثم 4,09 < 4,90. إذن: 3,99 < 4,09 < 4,9."]]],"k":"نقارن الجزء الصحيح أولًا، فإن تساوى نقارن الأرقام بعد الفاصلة من اليسار."},{"t":"جمع الأعداد العشرية وطرحها","bs":[["الفكرة الأساسية",["نضع الفواصل تحت بعضها، ونكمل الأرقام الناقصة بأصفار، ثم نجمع أو نطرح كالمعتاد."]],["أمثلة",["مثال 1: 12,7 + 3,85 = 12,70 + 3,85 = 16,55.","مثال 2: 9,4 − 2,75 = 9,40 − 2,75 = 6,65."]],["تطبيق",["مسألة: اشترى تلميذ دفترًا بـ 85,50 دج وقلمًا بـ 27,25 دج. كم دفع؟","الحل: 85,50 + 27,25 = 112,75 دج."]]],"k":"نضع الفواصل تحت بعضها، ونكمل الأرقام الناقصة بأصفار، ثم نجمع أو نطرح كالمعتاد."},{"t":"ضرب الأعداد العشرية","bs":[["الفكرة الأساسية",["الضرب في 10 أو 100 أو 1000: تتحرك الفاصلة إلى اليمين بمنزلة أو منزلتين أو ثلاث منازل."]],["ضرب عددين عشريين",["نضرب الأرقام كأنها طبيعية، ثم نضع الفاصلة بعدد الأرقام العشرية في العاملين معًا."]],["أمثلة",["مثال: 2,4 × 1,3: نحسب 24 × 13 = 312، وفي العاملين رقمان عشريان، إذن الناتج 3,12.","مثال: 4,25 × 2 = 8,50 = 8,5."]]],"k":"الضرب في 10 أو 100 أو 1000: تتحرك الفاصلة إلى اليمين بمنزلة أو منزلتين أو ثلاث منازل."},{"t":"أولويات العمليات الحسابية","bs":[["الفكرة الأساسية",["نحسب أولًا ما بين الأقواس، ثم الضرب والقسمة (من اليسار إلى اليمين)، ثم الجمع والطرح."]],["أمثلة",["مثال: 7 + 5 × 3 = 7 + 15 = 22. أما (7 + 5) × 3 = 12 × 3 = 36 لأن الأقواس تُحسب أولًا."]]],"k":"نحسب أولًا ما بين الأقواس، ثم الضرب والقسمة (من اليسار إلى اليمين)، ثم الجمع والطرح."},{"t":"القسمة الإقليدية وقابلية القسمة","bs":[["القسمة الإقليدية",["المقسوم = المقسوم عليه × الحاصل + الباقي، والباقي أصغر من المقسوم عليه."]],["أمثلة",["مثال: 47 ÷ 6: أكبر مضاعف لـ 6 لا يتجاوز 47 هو 42 = 6 × 7، والباقي 5. إذن 47 = 6 × 7 + 5.","مثال: 234 → 2 + 3 + 4 = 9، فهو يقبل القسمة على 3 وعلى 9."]],["الفكرة الأساسية",["يقبل العدد القسمة على: 2 إذا كان رقم آحاده زوجيًا ؛ 5 إذا انتهى بـ 0 أو 5 ؛ 10 إذا انتهى بـ 0 ؛ 3 إذا كان مجموع أرقامه يقبل القسمة على 3 ؛ 9 إذا كان مجموع أرقامه يقبل …"]]],"k":"المقسوم = المقسوم عليه × الحاصل + الباقي، والباقي أصغر من المقسوم عليه."},{"t":"الكسور والكتابات الكسرية","bs":[["الكسر a/b",["a البسط، b المقام (غير معدوم). يمثّل خارج قسمة a على b."]],["الفكرة الأساسية",["الكسور المتكافئة لها القيمة نفسها: 1/2 = 2/4 = 3/6 (نضرب البسط والمقام في العدد نفسه).","لإيجاد كسر من كمية: نقسم الكمية على المقام ثم نضرب في البسط."]],["أمثلة",["مثال: 3/5 من 40: 40 ÷ 5 = 8 ثم 8 × 3 = 24."]]],"k":"a البسط، b المقام (غير معدوم). يمثّل خارج قسمة a على b."},{"t":"الأعداد النسبية والمستقيم المدرّج","bs":[["الأعداد النسبية",["موجبة وسالبة وصفر. الأعداد الأكبر على المستقيم المدرّج تقع على اليمين."]],["الفكرة الأساسية",["−2 < 1 لأن −2 على يسار 1. وبين −5 و −1 يكون −5 هو الأصغر."]],["أمثلة",["مثال: رتّب تصاعديًا: 2 ؛ 0 ؛ −1 ؛ −3."]],["تطبيق",["الحل: −3 < −1 < 0 < 2."]]],"k":"موجبة وسالبة وصفر. الأعداد الأكبر على المستقيم المدرّج تقع على اليمين."},{"t":"التناسبية","bs":[["الفكرة الأساسية",["يكون جدول تناسبيًا إذا انتقلنا من أعداد السطر الأول إلى أعداد السطر الثاني بالضرب في العدد نفسه (معامل التناسبية).","طريقة الرجوع إلى الوحدة: نحسب ثمن الواحدة ثم نضرب."]],["أمثلة",["مثال: ثمن 3 كراريس 150 دج. ثمن الواحد = 150 ÷ 3 = 50 دج. ثمن 5 كراريس = 5 × 50 = 250 دج."]]],"k":"يكون جدول تناسبيًا إذا انتقلنا من أعداد السطر الأول إلى أعداد السطر الثاني بالضرب في العدد نفسه (معامل التناسبية)."},{"t":"تنظيم المعطيات والمتوسط الحسابي","bs":[["الفكرة الأساسية",["نستعمل الجداول لتجميع القيم وقراءة المعطيات بدقة.","المتوسط الحسابي = مجموع القيم ÷ عددها."]],["أمثلة",["مثال: علامات تلميذ: 10، 14، 12. المجموع = 36، عددها 3، المتوسط = 36 ÷ 3 = 12."]]],"k":"نستعمل الجداول لتجميع القيم وقراءة المعطيات بدقة."},{"t":"المستقيمات: التوازي والتعامد","bs":[["القطعة المستقيمة لها",["القطعة المستقيمة لها طرفان وطول. نصف المستقيم له بداية فقط. المستقيم لا بداية له ولا نهاية."]],["المستقيمان المتوازيان لا",["المستقيمان المتوازيان لا يتقاطعان. المتعامدان يتقاطعان بزاوية قائمة (90°)."]],["للتحقق من التعامد",["للتحقق من التعامد نستعمل الكوس (المنقلة)."]],["أمثلة",["مثال: إذا كانت الزاوية بين مستقيمين 90° فهما متعامدان."]]],"k":"القطعة المستقيمة لها طرفان وطول. نصف المستقيم له بداية فقط. المستقيم لا بداية له ولا نهاية."},{"t":"الزوايا والمثلثات","bs":[["زاوية حادة",["أصغر من 90°. قائمة: 90°. منفرجة: بين 90° و180°. مستقيمة: 180°."]],["الفكرة الأساسية",["مجموع زوايا المثلث = 180°."]],["أمثلة",["مثال: زاويتان في مثلث 45° و65°، فالثالثة = 180° − (45° + 65°) = 180° − 110° = 70°."]]],"k":"أصغر من 90°. قائمة: 90°. منفرجة: بين 90° و180°. مستقيمة: 180°."},{"t":"المثلثات الخاصة والرباعيات","bs":[["المثلث المتقايس الأضلاع",["أضلاعه الثلاثة متساوية. المتساوي الساقين: ضلعان متساويان. القائم: زاوية قائمة."]],["المربع",["4 أضلاع متساوية و4 زوايا قائمة. المستطيل: 4 زوايا قائمة وأضلاعه المتقابلة متساوية. المعين: 4 أضلاع متساوية."]],["أمثلة",["مثال: شكل رباعي أضلاعه متساوية وزواياه قائمة هو مربع."]]],"k":"أضلاعه الثلاثة متساوية. المتساوي الساقين: ضلعان متساويان. القائم: زاوية قائمة."},{"t":"المحيط والمساحة","bs":[["محيط المربع =",["محيط المربع = 4 × الضلع ؛ مساحته = الضلع × الضلع."]],["محيط المستطيل =",["محيط المستطيل = 2 × (الطول + العرض) ؛ مساحته = الطول × العرض."]],["مساحة المثلث =",["مساحة المثلث = (القاعدة × الارتفاع) ÷ 2."]],["أمثلة",["مثال: مستطيل طوله 8 سم وعرضه 3 سم: المحيط = 2 × (8 + 3) = 22 سم، المساحة = 8 × 3 = 24 سم². تنبيه: المحيط بوحدة الطول (سم) والمساحة بوحدة مربعة (سم²)."]]],"k":"محيط المربع = 4 × الضلع ؛ مساحته = الضلع × الضلع."},{"t":"متوازي المستطيلات والحجم","bs":[["الفكرة الأساسية",["متوازي المستطيلات مجسم له 6 أوجه مستطيلة و8 رؤوس و12 حرفًا.","الحجم = الطول × العرض × الارتفاع."]],["أمثلة",["مثال: صندوق 5 سم × 3 سم × 2 سم: الحجم = 5 × 3 × 2 = 30 سم³."]]],"k":"متوازي المستطيلات مجسم له 6 أوجه مستطيلة و8 رؤوس و12 حرفًا."},{"t":"التناظر المحوري","bs":[["في التناظر المحوري،",["في التناظر المحوري، المحور هو واسط (عمودي ومنصّف) القطعة التي تصل نقطة بصورتها."]],["النقطة وصورتها على",["النقطة وصورتها على بعدين متساويين من المحور."]],["لإنشاء صورة A",["نرسم عمودًا من A على المحور، ثم نضع A' على الجهة الأخرى بالبعد نفسه."]]],"k":"في التناظر المحوري، المحور هو واسط (عمودي ومنصّف) القطعة التي تصل نقطة بصورتها."},{"t":"الحساب الحرفي والمعادلات البسيطة","bs":[["الفكرة الأساسية",["الحرف قد يمثّل عددًا مجهولًا. 3x تعني 3 × x.","المعادلة مساواة فيها مجهول. نحلّها بإيجاد القيمة التي تجعل المساواة صحيحة."]],["أمثلة",["مثال: x + 7 = 15 ⟸ نطرح 7 من الطرفين: x = 15 − 7 = 8. التحقق: 8 + 7 = 15 ✓."]]],"k":"الحرف قد يمثّل عددًا مجهولًا. 3x تعني 3 × x."}]},"ar":{"name":"اللغة العربية","c":"#c62828","i":"📖","L":[{"t":"كيف ندرس النص؟","bs":[["خطوات الفهم",["اقرأ النص قراءة أولى لفهم الموضوع العام، ثم أعد القراءة لتحديد الأفكار المهمة.","استخرج الفكرة العامة في جملة موجزة تشمل موضوع النص كله.","قسّم النص إلى أفكار أساسية حسب الفقرات أو تغيّر المعنى.","اشرح الكلمات من سياقها، ثم استعملها في جمل من إنشائك."]],["مثال مبسط",["النص: «يحافظ أمين على نظافة حيه، فيجمع النفايات مع أصدقائه ويضعها في الحاوية.»","الفكرة العامة: مساهمة أمين وأصدقائه في المحافظة على نظافة الحي.","معنى «يحافظ»: يصون ويعتني."]]],"k":"اقرأ النص قراءة أولى لفهم الموضوع العام، ثم أعد القراءة لتحديد الأفكار المهمة."},{"t":"الفعل والزمن","bs":[["القاعدة",["الفعل الماضي يدل على حدث وقع وانتهى: كتبَ، نجحَ.","الفعل المضارع يدل غالبا على حدث يقع الآن أو في المستقبل: يكتبُ، ينجحُ.","فعل الأمر يطلب القيام بعمل: اكتبْ، اجتهدْ.","تذكّر: قد يتغير إعراب الفعل المضارع بحسب الأدوات الداخلة عليه."]],["تطبيق",["«عاد التلميذ، يراجع دروسه، ثم اكتب واجبك.» الأفعال: عاد (ماض)، يراجع (مضارع)، اكتب (أمر)."]]],"k":"الفعل الماضي يدل على حدث وقع وانتهى: كتبَ، نجحَ."},{"t":"الجملة الاسمية والجملة الفعلية","bs":[["القاعدة",["الجملة الاسمية تبدأ باسم، وتتكون غالبا من مبتدأ وخبر: العلمُ نورٌ.","المبتدأ مرفوع، والخبر مرفوع في الأصل.","الجملة الفعلية تبدأ بفعل، وتتكون غالبا من فعل وفاعل وقد يأتي بعدها مفعول به: قرأَ التلميذُ القصةَ.","الفاعل هو من قام بالفعل، والمفعول به هو من وقع عليه الفعل."]],["إعراب نموذجي",["العلمُ نورٌ: العلمُ مبتدأ مرفوع وعلامة رفعه الضمة؛ نورٌ خبر مرفوع وعلامة رفعه الضمة.","كتبَ التلميذُ الدرسَ: كتب فعل ماض؛ التلميذ فاعل مرفوع؛ الدرس مفعول به منصوب."]]],"k":"الجملة الاسمية تبدأ باسم، وتتكون غالبا من مبتدأ وخبر: العلمُ نورٌ."},{"t":"النعت والمنعوت","bs":[["النعت صفة تذكر",["النعت صفة تذكر لتوضيح اسم قبلها يسمى المنعوت."]],["يتبع النعت منعوته",["يتبع النعت منعوته في التذكير والتأنيث، والإفراد والتثنية والجمع، والتعريف والتنكير، والإعراب في الأمثلة المقررة."]],["مثال",["قرأتُ قصةً ممتعةً. قصةً: منعوت، ممتعةً: نعت منصوب."]]],"k":"النعت صفة تذكر لتوضيح اسم قبلها يسمى المنعوت."},{"t":"الضمائر وأسماء الإشارة","bs":[["الضمير يدل على",["الضمير يدل على متكلم أو مخاطب أو غائب: أنا، نحن، أنت، هو، هي، هم."]],["من الضمائر المتصلة",["ـه، ـها، ـهم، ـك، ـنا، مثل: كتابه، رأيتها، ساعدنا."]],["من أسماء الإشارة",["هذا للمفرد المذكر، هذه للمفرد المؤنث، هاتان/هذان للمثنى، هؤلاء للجمع، ذلك وتلك للبعيد."]]],"k":"الضمير يدل على متكلم أو مخاطب أو غائب: أنا، نحن، أنت، هو، هي، هم."},{"t":"المفرد والمثنى والجمع","bs":[["المفرد يدل على",["المفرد يدل على واحد أو واحدة: تلميذ، تلميذة."]],["المثنى يدل على",["المثنى يدل على اثنين أو اثنتين: تلميذين/تلميذان، تلميذتين/تلميذتان."]],["جمع المذكر السالم",["معلمين/معلمون، وجمع المؤنث السالم: معلمات، وجمع التكسير: رجال، كتب."]],["تختلف علامة الإعراب",["تختلف علامة الإعراب حسب موقع الكلمة ونوع الجمع."]]],"k":"المفرد يدل على واحد أو واحدة: تلميذ، تلميذة."},{"t":"الفاعل والمفعول به","bs":[["الفاعل اسم مرفوع",["الفاعل اسم مرفوع يدل على من قام بالفعل: زرعَ الفلاحُ الشجرةَ."]],["المفعول به اسم",["المفعول به اسم منصوب وقع عليه الفعل: زرع الفلاحُ الشجرةَ."]],["في المثال",["الفلاحُ فاعل مرفوع، الشجرةَ مفعول به منصوب."]]],"k":"الفاعل اسم مرفوع يدل على من قام بالفعل: زرعَ الفلاحُ الشجرةَ."},{"t":"الإملاء: التاء المفتوحة والمربوطة والهاء","bs":[["القاعدة",["التاء المربوطة (ة) تظهر غالبا في آخر الأسماء المؤنثة: مدرسة، شجرة. عند الوقف تُنطق هاء غالبا.","التاء المفتوحة (ت) تبقى تاء عند الوقف: بنت، بيت، كتبتْ.","الهاء (ه) ضمير أو حرف أصلي: كتابه، وجه، مياه. لا تخلط بين «مدرسة» .و«مدرسته»"]],["طريقة التحقق",["ضع الكلمة في جملة أو صِلْ بها ضميرا: شجرة ← شجرتها؛ بنت ← بنتها. انتبه إلى أصل الكلمة ومعناها."]]],"k":"التاء المربوطة (ة) تظهر غالبا في آخر الأسماء المؤنثة: مدرسة، شجرة. عند الوقف تُنطق هاء غالبا."},{"t":"التعبير الكتابي","bs":[["مقدمة قصيرة تعرّف",["مقدمة قصيرة تعرّف بالموضوع."]],["عرض يتضمن فكرتين",["عرض يتضمن فكرتين أو ثلاثا مرتبة مع أمثلة."]],["خاتمة تلخص الفكرة",["خاتمة تلخص الفكرة أو تقدم نصيحة."]],["استعمل جملا واضحة",["استعمل جملا واضحة وعلامات ترقيم، وتجنب تكرار الكلمات."]],["راجع الإملاء، واتفاق",["راجع الإملاء، واتفاق الفعل والفاعل، وترابط الجمل. نموذج موضوع: المحافظة على البيئة"]],["البيئة بيتنا الكبير،",["البيئة بيتنا الكبير، لذلك يجب أن نحافظ عليها نظيفة وجميلة. أضع النفايات في الأماكن المخصصة، وأقتصد في الماء، وأشارك في غرس الأشجار. كما أنصح أصدقائي بعدم تلويث الشوارع …"]]],"k":"مقدمة قصيرة تعرّف بالموضوع."},{"t":"التشبيه والصورة الفنية – مدخل مبسط","bs":[["التشبيه يقارن شيئا",["التشبيه يقارن شيئا بشيء آخر لوجود صفة مشتركة بينهما."]],["مثال",["«العلم كالنور.» المشبّه: العلم، المشبّه به: النور، أداة التشبيه: الكاف، وجه الشبه: الهداية أو الإضاءة بحسب السياق."]],["في تحليل النص،",["في تحليل النص، لا تكتف بتسمية الصورة؛ اشرح المعنى الذي تضيفه."]]],"k":"التشبيه يقارن شيئا بشيء آخر لوجود صفة مشتركة بينهما."}]},"fr":{"name":"الفرنسية","c":"#6a1b9a","i":"📘","L":[{"t":"Se présenter – Présentation personnelle","bs":[["Vocabulaire et phrases …",["`Bonjour ! Salut ! Au revoir ! À bientôt !`","`Je m’appelle Lina. J’ai onze ans. J’habite à Tlemcen. Je suis élève en première année moyenne.`","`Pour demander le nom : Comment tu t’appelles ? Pour demander l’âge : Quel âge as-tu ?`","`Attention : « je suis » exprime l’identité ou la profession ; « j’ai » exprime l’âge.`"]],["أمثلة",["Exemple"]]],"k":"`Bonjour ! Salut ! Au revoir ! À bientôt !`"},{"t":"Les pronoms personnels sujets","bs":[["Je, tu, il,",["`Je, tu, il, elle, on, nous, vous, ils, elles remplacent les noms et accompagnent le verbe conjugué.`"]],["Exemple",["`Amine est élève.`"]],["Il est élève.",["`Il est élève.`"]],["Sara et Lina",["`Sara et Lina sont amies.`"]],["Elles sont amies.",["`Elles sont amies.`"]]],"k":"`Je, tu, il, elle, on, nous, vous, ils, elles remplacent les noms et accompagnent le verbe conjugué.`"},{"t":"Les verbes être et avoir au présent","bs":[["ÊTRE",["`je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.`"]],["AVOIR",["`j’ai, tu as, il/elle a, nous avons, vous avez, ils/elles ont.`"]],["Exemples",["`Nous sommes en classe. Vous avez un livre. Elles sont contentes.`"]]],"k":"`ÊTRE : je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.`"},{"t":"Le présent des verbes réguliers en -ER","bs":[["Pour parler d’une",["`Pour parler d’une action habituelle, on utilise souvent le présent.`"]],["Parler",["`je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent.`"]],["Les terminaisons habituelles",["`Les terminaisons habituelles sont : -e, -es, -e, -ons, -ez, -ent.`"]],["Exemples",["`J’écoute le professeur. Nous aimons la lecture.`"]]],"k":"`Pour parler d’une action habituelle, on utilise souvent le présent.`"},{"t":"Le nom, le déterminant et l’adjectif","bs":[["Le nom désigne",["`Le nom désigne une personne, un animal, un lieu ou une chose : élève, chat, école, cahier.`"]],["Le déterminant accompagne",["`Le déterminant accompagne le nom : un, une, le, la, les, des, mon, ma, mes.`"]],["L’adjectif donne une",["`L’adjectif donne une précision sur le nom : un petit jardin, une maison propre.`"]],["L’adjectif s’accorde …",["`L’adjectif s’accorde généralement en genre et en nombre avec le nom : un garçon gentil, une fille gentille.`"]]],"k":"`Le nom désigne une personne, un animal, un lieu ou une chose : élève, chat, école, cahier.`"},{"t":"Masculin, féminin, singulier et pluriel","bs":[["Souvent, on forme",["`Souvent, on forme le féminin en ajoutant -e : petit/petite, grand/grande. Il existe des exceptions.`"]],["Souvent, on forme",["`Souvent, on forme le pluriel en ajoutant -s : un livre/des livres. Les mots en -eau prennent souvent -x : un bateau/des bateaux.`"]],["Exemples",["`un élève sérieux / une élève sérieuse ; un cahier bleu / des cahiers bleus.`"]]],"k":"`Souvent, on forme le féminin en ajoutant -e : petit/petite, grand/grande. Il existe des exceptions.`"},{"t":"La phrase déclarative, interrogative et impérative","bs":[["La phrase déclarative",["`La phrase déclarative donne une information : J’aime le français.`"]],["La phrase interrogative",["`La phrase interrogative pose une question : Où habites-tu ?`"]],["La phrase impérative",["`La phrase impérative donne un ordre ou un conseil : Écoute bien !`"]],["Une phrase commence",["`Une phrase commence par une majuscule et se termine par un signe de ponctuation.`"]]],"k":"`La phrase déclarative donne une information : J’aime le français.`"},{"t":"Comprendre un texte court","bs":[["Lis le texte",["`Lis le texte une première fois pour comprendre le sujet général.`"]],["Souligne les mots",["`Souligne les mots importants : personnes, lieux, temps et actions.`"]],["Réponds avec une",["`Réponds avec une phrase complète lorsque la question le demande.`"]],["Exemple",["`« Nadia habite à Oran. Elle va au collège à pied. » Où habite Nadia ? — Elle habite à Oran.`"]]],"k":"`Lis le texte une première fois pour comprendre le sujet général.`"},{"t":"Production écrite : ma journée scolaire","bs":[["Méthode",["`Organise le texte en début, déroulement et fin.`","`Utilise des connecteurs simples : d’abord, ensuite, puis, enfin.`","`Vérifie les majuscules, les points, les accords et les verbes.`"]],["Modèle",["`Je me réveille à sept heures. D’abord, je prends mon petit-déjeuner et je prépare mon cartable. Ensuite, je vais au collège. En classe, j’écoute les professeurs et je …`"]]],"k":"`Organise le texte en début, déroulement et fin.`"},{"t":"Projet 1 · Vocabulaire : La nominalisation","bs":[["À retenir",["`On forme des noms d'action à partir de verbes en ajoutant un suffixe au radical : -age, -ement, -tion, -ation.`","`Verbes en -er : radical + -age ou -ment (laver → lavage ; entraîner → entraînement). Verbes en -er aussi : -ation (vacciner → vaccination).`"]],["Exemples",["`laver → lavage`","`nettoyer → nettoyage`","`brosser → brossage`","`arroser → arrosage`"]]],"k":"`On forme des noms d'action à partir de verbes en ajoutant un suffixe au radical : -age, -ement, -tion, -ation.`"},{"t":"Projet 1 · Grammaire : La phrase déclarative (forme affirmative et négative)","bs":[["À retenir",["`La phrase déclarative sert à déclarer quelque chose, raconter un événement ou donner son avis. Elle commence par une majuscule et se termine par un point.`","`Forme affirmative : on affirme ou on exprime son accord. Forme négative : on nie ou on exprime son désaccord.`","`Pour passer à la forme négative, on encadre le verbe : ne … pas, ne … plus, ne … jamais, ne … rien, ne … personne. Devant une voyelle : n'.`"]],["Exemples",["`J'aime les sucreries. → Je n'aime pas les sucreries.`","`Je n'aime plus les sodas.`","`Je n'ai jamais aimé les frites.`","`Je n'aime rien à part les fruits.`"]]],"k":"`La phrase déclarative sert à déclarer quelque chose, raconter un événement ou donner son avis. Elle commence par une majuscule et se termine par un point.`"},{"t":"Projet 1 · Grammaire : Les substituts grammaticaux","bs":[["À retenir",["`Pour éviter les répétitions, on remplace un nom ou un groupe nominal par un substitut grammatical : pronom personnel (il, elle, le, la, les, lui…), pronom possessif (le …`"]],["Exemples",["`Rends visite à ta grand-mère, elle est malade.`","`Mes gants sont rouges, ceux de ma sœur sont jaunes.`","`Prête-moi ta serviette, j'ai oublié la mienne.`"]]],"k":"`Pour éviter les répétitions, on remplace un nom ou un groupe nominal par un substitut grammatical : pronom personnel (il, elle, le, la, les, lui…), pronom possessif (le mien, la tienne, les leurs…), …`"},{"t":"Projet 1 · Conjugaison : Les verbes du 1er groupe au présent de l'indicatif","bs":[["À retenir",["`Les verbes du 1er groupe se terminent par -er à l'infinitif (sauf aller, qui est du 3e groupe).`","`Terminaisons au présent : -e, -es, -e, -ons, -ez, -ent. Radical = infinitif sans -er.`","`Particularités : manger → nous mangeons ; commencer → nous commençons ; nettoyer → je nettoie ; appeler → j'appelle.`"]],["Exemples",["`constituer : je constitue, tu constitues, il/elle constitue, nous constituons, vous constituez, ils/elles constituent`","`se brosser : je me brosse, tu te brosses, il se brosse, nous nous brossons, vous vous brossez, ils se brossent`"]]],"k":"`Les verbes du 1er groupe se terminent par -er à l'infinitif (sauf aller, qui est du 3e groupe).`"},{"t":"Projet 1 · Orthographe : L'accord du verbe avec le sujet","bs":[["À retenir",["`Le verbe s'accorde toujours en personne et en nombre avec son sujet.`","`Si le sujet est composé (Fatiha et toi), le verbe se met au pluriel. Moi + un autre = nous ; toi + un autre = vous.`","`Plusieurs verbes pour un seul sujet : chaque verbe s'accorde avec ce sujet.`"]],["Exemples",["`Le médecin accueille son patient, l'ausculte puis lui prescrit un traitement.`","`Mon frère et moi aimons les revues scientifiques.`"]]],"k":"`Le verbe s'accorde toujours en personne et en nombre avec son sujet.`"},{"t":"Projet 1 · Vocabulaire : Les synonymes et les périphrases","bs":[["À retenir",["`Les synonymes sont des mots de sens proche qui appartiennent à la même classe grammaticale (manger / se nourrir).`","`Une périphrase est un groupe de mots qui remplace un mot (le Roi des animaux = le lion).`"]],["Exemples",["`bon / délicieux`","`boire / se désaltérer`","`le lait = le liquide blanc produit par la vache`"]]],"k":"`Les synonymes sont des mots de sens proche qui appartiennent à la même classe grammaticale (manger / se nourrir).`"},{"t":"Projet 1 · Vocabulaire : Les connecteurs d'énumération","bs":[["À retenir",["`Ils organisent un texte explicatif ou prescriptif : d'abord / premièrement, ensuite / puis / deuxièmement, enfin / pour finir / en dernier lieu.`","`Avant une énumération, on met souvent deux-points ; les éléments sont séparés par des virgules ou des points-virgules.`"]],["Exemples",["`D'abord, je mouille mes mains. Ensuite, je les savonne. Enfin, je les rince.`"]]],"k":"`Ils organisent un texte explicatif ou prescriptif : d'abord / premièrement, ensuite / puis / deuxièmement, enfin / pour finir / en dernier lieu.`"},{"t":"Projet 1 · Grammaire : L'expansion du groupe nominal : l'adjectif qualificatif et le complément du nom","bs":[["À retenir",["`Le groupe nominal (GN) = déterminant + nom. On peut l'enrichir : adjectif qualificatif (une brosse électrique), complément du nom introduit par de, à, en… (une brosse à …`","`Les adjectifs qualificatifs s'accordent en genre et en nombre avec le nom.`"]],["Exemples",["`une salle de bain moderne`","`des gants de toilette rouges`"]]],"k":"`Le groupe nominal (GN) = déterminant + nom. On peut l'enrichir : adjectif qualificatif (une brosse électrique), complément du nom introduit par de, à, en… (une brosse à dents, un gant de toilette).`"},{"t":"Projet 1 · Conjugaison : Les verbes du 2e et du 3e groupe au présent de l'indicatif","bs":[["À retenir",["`2e groupe : infinitif en -ir, participe présent en -issant (finir → finissant). Terminaisons : -is, -is, -it, -issons, -issez, -issent.`","`3e groupe : tous les autres verbes (aller, venir, prendre, faire, dire, voir, pouvoir, vouloir, savoir…). Terminaisons variables : -s, -s, -t, -ons, -ez, -ent (ou -x, …`"]],["Exemples",["`finir : je finis, tu finis, il finit, nous finissons, vous finissez, ils finissent`","`prendre : je prends, tu prends, il prend, nous prenons, vous prenez, ils prennent`","`aller : je vais, tu vas, il va, nous allons, vous allez, ils vont`"]]],"k":"`2e groupe : infinitif en -ir, participe présent en -issant (finir → finissant). Terminaisons : -is, -is, -it, -issons, -issez, -issent.`"},{"t":"Projet 1 · Orthographe : L'accord de l'adjectif qualificatif","bs":[["À retenir",["`L'adjectif s'accorde avec le nom qu'il qualifie. Féminin : +e (grand → grande). Pluriel : +s (grands). Cas particuliers : -eux → -euse ; -er → -ère ; -if → -ive ; -al → …`"]],["Exemples",["`un repas équilibré, une alimentation équilibrée, des repas équilibrés`","`un geste simple → des gestes simples`"]]],"k":"`L'adjectif s'accorde avec le nom qu'il qualifie. Féminin : +e (grand → grande). Pluriel : +s (grands). Cas particuliers : -eux → -euse ; -er → -ère ; -if → -ive ; -al → -aux au pluriel masculin.`"},{"t":"Projet 1 · Orthographe : Les signes de ponctuation : le point, la virgule, deux-points","bs":[["À retenir",["`Le point (.) termine une phrase. La virgule (,) sépare les éléments d'une énumération. Les deux-points (:) introduisent une énumération, une explication ou une …`"]],["Exemples",["`Pour rester en forme, il faut : manger équilibré, bouger et dormir.`"]]],"k":"`Le point (.) termine une phrase. La virgule (,) sépare les éléments d'une énumération. Les deux-points (:) introduisent une énumération, une explication ou une définition. Le point-virgule (;) sépare …`"},{"t":"Projet 2 · Vocabulaire : La reformulation par « c'est-à-dire » et « autrement dit »","bs":[["À retenir",["`Reformuler, c'est redire autrement pour expliquer. On utilise : c'est-à-dire, autrement dit, en d'autres termes.`"]],["Exemples",["`Le TGV est un train à grande vitesse, c'est-à-dire un train très rapide.`","`La pollution, autrement dit la dégradation de l'environnement, menace la santé.`"]]],"k":"`Reformuler, c'est redire autrement pour expliquer. On utilise : c'est-à-dire, autrement dit, en d'autres termes.`"},{"t":"Projet 2 · Grammaire : L'expression de la cause","bs":[["À retenir",["`La cause répond à la question « pourquoi ? ». Elle s'exprime avec : parce que, car, puisque, comme, en effet, à cause de (cause négative), grâce à (cause positive).`"]],["Exemples",["`Il est en retard parce qu'il a raté le bus.`","`Grâce aux robots, le travail est plus rapide.`"]]],"k":"`La cause répond à la question « pourquoi ? ». Elle s'exprime avec : parce que, car, puisque, comme, en effet, à cause de (cause négative), grâce à (cause positive).`"},{"t":"Projet 2 · Grammaire : L'expression de la conséquence","bs":[["À retenir",["`La conséquence répond à « avec quel résultat ? ». Mots : donc, alors, c'est pourquoi, si bien que, de sorte que, tellement… que, si… que.`"]],["Exemples",["`Il pleut, donc je reste à la maison.`","`Il y a tant de pollution que l'air est irrespirable.`"]]],"k":"`La conséquence répond à « avec quel résultat ? ». Mots : donc, alors, c'est pourquoi, si bien que, de sorte que, tellement… que, si… que.`"},{"t":"Projet 2 · Grammaire : L'expression du but","bs":[["À retenir",["`Le but répond à « dans quel but ? ». Mots : pour, afin de (+ infinitif), pour que, afin que (+ subjonctif).`"]],["Exemples",["`Je trie mes déchets pour protéger la planète.`","`On recycle afin que la nature soit préservée.`"]]],"k":"`Le but répond à « dans quel but ? ». Mots : pour, afin de (+ infinitif), pour que, afin que (+ subjonctif).`"},{"t":"Projet 2 · Conjugaison : Le passé composé (1er, 2e et 3e groupe)","bs":[["À retenir",["`Passé composé = auxiliaire (avoir ou être au présent) + participe passé.`","`Participes passés : 1er groupe -é (parler → parlé) ; 2e groupe -i (finir → fini) ; 3e groupe variables : -u (voir → vu), -is (prendre → pris), -it (dire → dit), -ert …`","`Auxiliaire être : verbes de mouvement (aller, venir, partir, arriver, entrer, sortir, monter, descendre, naître, mourir, tomber, rester) et verbes pronominaux.`"]],["Exemples",["`J'ai mangé. Tu as fini. Il a pris. Nous sommes allés. Elles se sont lavées.`"]]],"k":"`Passé composé = auxiliaire (avoir ou être au présent) + participe passé.`"},{"t":"Projet 2 · Orthographe : L'accord du participe passé avec « être » et avec « avoir »","bs":[["À retenir",["`Avec être : le participe passé s'accorde avec le sujet (Elle est partie. Ils sont partis).`","`Avec avoir : il ne s'accorde pas avec le sujet. Il s'accorde avec le COD seulement si le COD est placé avant le verbe (Les fleurs que j'ai cueillies).`"]],["Exemples",["`Les élèves sont arrivés. Elle a mangé des pommes. Les pommes qu'elle a mangées.`"]]],"k":"`Avec être : le participe passé s'accorde avec le sujet (Elle est partie. Ils sont partis).`"},{"t":"Projet 2 · Vocabulaire : Les synonymes et les antonymes","bs":[["À retenir",["`Synonymes : mots de sens proche (rapide / vite). Antonymes : mots de sens contraire (grand ≠ petit, chaud ≠ froid, lent ≠ rapide). On forme aussi des antonymes avec des …`"]],["Exemples",["`propre ≠ sale`","`pollué ≠ propre`","`construire ≠ détruire`"]]],"k":"`Synonymes : mots de sens proche (rapide / vite). Antonymes : mots de sens contraire (grand ≠ petit, chaud ≠ froid, lent ≠ rapide). On forme aussi des antonymes avec des préfixes : in-, im-, dé-, mal- …`"},{"t":"Projet 3 · Grammaire : La phrase impérative","bs":[["À retenir",["`La phrase impérative sert à donner un ordre, un conseil, une consigne ou une interdiction. Elle se termine par un point ou un point d'exclamation.`","`Le verbe est à l'impératif, sans sujet exprimé.`"]],["Exemples",["`Ferme le robinet ! Éteignez la lumière. Ne jetez pas vos déchets par terre.`"]]],"k":"`La phrase impérative sert à donner un ordre, un conseil, une consigne ou une interdiction. Elle se termine par un point ou un point d'exclamation.`"},{"t":"Projet 3 · Conjugaison : L'impératif présent pour exprimer une consigne","bs":[["À retenir",["`L'impératif a trois personnes : 2e sing. (tu), 1re plur. (nous), 2e plur. (vous). Il s'emploie sans sujet.`","`1er groupe : pas de -s à la 2e personne du singulier (Parle ! Ferme !). Sauf devant y et en : Vas-y ! Manges-en !`","`Avoir : aie, ayons, ayez. Être : sois, soyons, soyez. Aller : va, allons, allez.`"]],["Exemples",["`Économise l'eau. Économisons l'énergie. Économisez le papier.`","`Sois attentif ! Ayez du courage.`"]]],"k":"`L'impératif a trois personnes : 2e sing. (tu), 1re plur. (nous), 2e plur. (vous). Il s'emploie sans sujet.`"},{"t":"Projet 3 · Orthographe : Les adverbes en -ment","bs":[["À retenir",["`On forme les adverbes en -ment à partir de l'adjectif au féminin + -ment (lent → lentement ; doux → doucement).`","`Adjectifs en -ant → -amment (constant → constamment) ; en -ent → -emment (récent → récemment). Adjectifs en -i, -é, -u : +ment (vrai → vraiment, poli → poliment).`"]],["Exemples",["`Mange lentement. Il agit prudemment. Elle travaille sérieusement.`"]]],"k":"`On forme les adverbes en -ment à partir de l'adjectif au féminin + -ment (lent → lentement ; doux → doucement).`"},{"t":"Projet 3 · Conjugaison : Le mode infinitif, le mode subjonctif, le futur simple pour exprimer une consigne","bs":[["À retenir",["`L'infinitif exprime une consigne générale (Ne pas jeter.). Le subjonctif présent s'emploie après il faut que, pour que : Il faut que tu sois attentif.`","`Futur simple : radical + -rai, -ras, -ra, -rons, -rez, -ront (parler → je parlerai ; être → je serai ; avoir → j'aurai ; aller → j'irai ; faire → je ferai).`"]],["Exemples",["`Ne pas jeter les papiers par terre.`","`Il faut que tu éteignes la lumière.`","`Tu trieras tes déchets.`"]]],"k":"`L'infinitif exprime une consigne générale (Ne pas jeter.). Le subjonctif présent s'emploie après il faut que, pour que : Il faut que tu sois attentif.`"},{"t":"Projet 3 · Grammaire : La tournure impersonnelle avec le verbe « falloir »","bs":[["À retenir",["`Il faut + infinitif ou il faut que + subjonctif exprime une obligation, une nécessité. Le verbe falloir ne s'emploie qu'à la 3e personne du singulier avec le sujet …`"]],["Exemples",["`Il faut économiser l'eau. Il faut que nous protégions la nature.`"]]],"k":"`Il faut + infinitif ou il faut que + subjonctif exprime une obligation, une nécessité. Le verbe falloir ne s'emploie qu'à la 3e personne du singulier avec le sujet impersonnel « il » (il fallait, il …`"},{"t":"Projet 3 · Orthographe : Les homophones grammaticaux : a/à, et/est, ce/se, ces/ses","bs":[["À retenir",["`a = verbe avoir (peut se mettre à « avait »). à = préposition.`","`et = conjonction (on peut dire « et puis »). est = verbe être (on peut dire « était »).`","`ce = déterminant/pronom démonstratif (ce jardin). se = pronom réfléchi devant un verbe (il se lave).`","`ces = déterminant démonstratif pluriel (ces fleurs). ses = déterminant possessif (ses fleurs = les fleurs de lui/elle).`"]],["Exemples",["`Il a un vélo. Il va à l'école.`","`Elle est gentille et drôle.`","`Ce garçon se lave les mains.`","`Ces enfants aiment leurs jeux ; ses amis aussi.`"]]],"k":"`a = verbe avoir (peut se mettre à « avait »). à = préposition.`"},{"t":"Projet 3 · Vocabulaire : La famille de mots","bs":[["À retenir",["`Une famille de mots regroupe des mots formés à partir d'un même radical : terre, terrain, terrasse, enterrer, déterrer, souterrain.`","`On les forme avec des préfixes (avant le radical) et des suffixes (après).`"]],["Exemples",["`eau : aquatique, arroser, eau-de-vie… (selon radical) ; propre : propreté, nettoyer… ; vert : verdure, verdir, reverdir`"]]],"k":"`Une famille de mots regroupe des mots formés à partir d'un même radical : terre, terrain, terrasse, enterrer, déterrer, souterrain.`"},{"t":"Projet 3 · Vocabulaire : La consigne et l'interdiction","bs":[["À retenir",["`La consigne indique ce qu'il faut faire (impératif, infinitif, il faut). L'interdiction indique ce qu'il ne faut pas faire (ne pas + infinitif, défense de, interdit de, …`"]],["Exemples",["`Interdit de fumer. Défense de jeter des papiers. Ne pas marcher sur la pelouse.`"]]],"k":"`La consigne indique ce qu'il faut faire (impératif, infinitif, il faut). L'interdiction indique ce qu'il ne faut pas faire (ne pas + infinitif, défense de, interdit de, ne … pas à l'impératif).`"}]},"en":{"name":"الإنجليزية","c":"#2e7d32","i":"🔤","L":[{"t":"Greetings and introductions — التحية والتعارف","bs":[["Useful expressions",["Hello! / Hi! = مرحبا","Good morning. = صباح الخير","Good afternoon. = مساء الخير (بعد الظهر)","Good evening. = مساء الخير"]],["أمثلة",["Example"]]],"k":"Hello! / Hi! = مرحبا"},{"t":"Personal pronouns and the verb BE — الضمائر والفعل to be","bs":[["الضمائر والفعل BE (يكون)",["I am = أنا","We are = نحن","You are = أنت/أنتم","They are = هم"]],["أمثلة",["Examples"]]],"k":"I am = أنا"},{"t":"The verb HAVE GOT — الفعل have got","bs":[["للتعبير عن الملكية (يملك / …",["`I / you / we / they + have got: I have got a book.`","`He / she / it + has got: She has got a blue bag.`","النفي: `haven't got / hasn't got: He hasn't got a ruler.`","السؤال: `Have you got a pen? — Yes, I have. / No, I haven't. Has she got a bag? — Yes, she has. / No, she hasn't.`"]],["أمثلة",["Examples"]]],"k":"`I / you / we / they + have got: I have got a book.`"},{"t":"Articles, plural and classroom objects — أدوات التنكير والجمع","bs":[["أدوات التنكير",["a قبل صوت ساكن غالبا: a pen, a book, a ruler.","`an قبل صوت متحرك (a, e, i, o, u): an apple, an egg, an orange.`"]],["الجمع",["غالبا نضيف s: `pen → pens, book → books.`","بعد s, x, ch, sh نضيف es: `box → boxes, class → classes.`","جموع شاذة: `child → children, man → men, woman → women. Classroom objects: board (سبورة), desk (طاولة), chair (كرسي), bag (حقيبة), pencil (قلم رصاص), eraser (ممحاة).`"]]],"k":"a قبل صوت ساكن غالبا: a pen, a book, a ruler."},{"t":"Adjectives and colours — الصفات والألوان","bs":[["الصفة تأتي قبل",["الصفة تأتي قبل الاسم في الإنجليزية وهي لا تتغير بالجمع:"]],["a red bag",["a red bag · two red bags · a small house. الألوان: red (أحمر), blue (أزرق), green (أخضر), yellow (أصفر), black (أسود), white (أبيض), orange (برتقالي), brown (بني). صفات …"]],["I have got",["`I have got a blue pen.`"]],["She has a",["`She has a big green bag.`"]],["أمثلة",["Examples"]]],"k":"الصفة تأتي قبل الاسم في الإنجليزية وهي لا تتغير بالجمع:"},{"t":"There is / There are and prepositions — يوجد وحروف الجر","bs":[["Grammar",["`There is + مفرد: There is a board in the classroom.`","`There are + جمع: There are twenty pupils in the class.`","النفي: `There isn't a window. · There aren't any chairs.`","السؤال: `Is there a clock? — Yes, there is. / Are there any books? — No, there aren't.`"]],["حروف الجر المكانية",["in = في","on = على (فوق سطح)","under = تحت","next to = بجانب"]],["أمثلة",["`Example: The book is on the desk. The bag is under the chair.`"]]],"k":"`There is + مفرد: There is a board in the classroom.`"},{"t":"Daily routine and simple present — الروتين اليومي والمضارع البسيط","bs":[["المضارع البسيط للعادات",["المضارع البسيط للعادات والحقائق."]],["I / you",["`I / you / we / they + الفعل: I get up at seven.`"]],["He / she / it + الفعل مع s",["`She plays football. · He reads a book.`"]],["go → goes,",["`go → goes, watch → watches (نضيف es بعد s, sh, ch, x, o).`"]],["النفي",["`do not (don't) / does not (doesn't) + الفعل الأصلي: He doesn't play.`"]],["السؤال",["Do you play? / Does she play? Daily routine: get up (يستيقظ), have breakfast (يتناول الفطور), go to school (يذهب للمدرسة), do homework (يؤدي الواجب), go to bed (ينام). …"]]],"k":"المضارع البسيط للعادات والحقائق."},{"t":"Writing a short paragraph — كتابة فقرة قصيرة","bs":[["خطوات كتابة فقرة",["خطوات كتابة فقرة تعريف بالنفس 1) ابدئي بالاسم والعمر: My name is Sami."]],["I am eleven.",["`I am eleven.`"]],["2) أضيفي المكان",["`I live in Algiers.`"]],["I am from",["`I am from Algeria.`"]],["3) تحدثي عن",["3) تحدثي عن العائلة أو الهواية: I have got a sister."]],["I like football.",["`I like football.`"]]],"k":"خطوات كتابة فقرة تعريف بالنفس 1) ابدئي بالاسم والعمر: My name is Sami. I am eleven. 2) أضيفي المكان: I live in Algiers. I am from Algeria. 3) تحدثي عن العائلة أو الهواية: I have got a sister. I like …"}]},"hist":{"name":"التاريخ والجغرافيا","c":"#e65100","i":"🌍","L":[{"t":"ما التاريخ؟","bs":[["مفاهيم أساسية",["التاريخ دراسة ماضي الإنسان اعتمادا على الأدلة والمصادر.","من المصادر التاريخية: الوثائق المكتوبة، النقوش، الآثار، العملات، الروايات الشفوية والصور.","المؤرخ يجمع المعلومات ويفحصها ويقارن بينها قبل استخلاص النتائج."]],["الخط الزمني",["الخط الزمني طريقة لترتيب الأحداث حسب وقوعها من الأقدم إلى الأحدث.","القرن يساوي مئة سنة، والألفية تساوي ألف سنة.","عند قراءة خط زمني، انتبه إلى تاريخ البداية والنهاية ووحدة القياس."]]],"k":"التاريخ دراسة ماضي الإنسان اعتمادا على الأدلة والمصادر."},{"t":"ما قبل التاريخ والتاريخ","bs":[["يستعمل مصطلح ما",["يستعمل مصطلح ما قبل التاريخ للفترة السابقة لظهور الكتابة في منطقة معينة."]],["تساعد الأدوات الحجرية",["تساعد الأدوات الحجرية والعظام والرسوم والآثار على معرفة أنماط عيش الإنسان القديم."]],["تختلف بداية التاريخ",["تختلف بداية التاريخ المكتوب من منطقة إلى أخرى بسبب اختلاف زمن ظهور الكتابة."]]],"k":"يستعمل مصطلح ما قبل التاريخ للفترة السابقة لظهور الكتابة في منطقة معينة."},{"t":"مصادر دراسة تاريخ الجزائر","bs":[["كيف ندرس الماضي؟",["كيف ندرس الماضي؟"]],["تساعد الآثار والمواقع",["تساعد الآثار والمواقع القديمة واللقى والكتابات في التعرف إلى حياة السكان عبر العصور."]],["يجب تحديد مكان",["يجب تحديد مكان العثور على الأثر وزمنه المحتمل ومقارنته بمصادر أخرى."]],["لا يكفي أثر",["لا يكفي أثر واحد دائما لإثبات تفسير تاريخي؛ ينبغي الاستناد إلى أدلة متعددة."]]],"k":"كيف ندرس الماضي؟"},{"t":"مهارات الإجابة في التاريخ","bs":[["عرّف المصطلح تعريفا",["عرّف المصطلح تعريفا واضحا ومباشرا."]],["عند سؤال",["علّل، اذكر السبب ثم اربطه بالنتيجة."]],["عند دراسة وثيقة،",["عند دراسة وثيقة، حدّد طبيعتها وصاحبها أو مصدرها إن عُرف، وموضوعها، ثم استخرج المعلومات المطلوبة."]]],"k":"عرّف المصطلح تعريفا واضحا ومباشرا."},{"t":"ما الجغرافيا؟","bs":[["الجغرافيا دراسة الظواهر",["الجغرافيا دراسة الظواهر الطبيعية والبشرية وتوزعها في المجال والعلاقات بينها."]],["الجغرافيا الطبيعية تدرس",["الجغرافيا الطبيعية تدرس التضاريس والمناخ والمياه والغطاء النباتي."]],["الجغرافيا البشرية تدرس",["الجغرافيا البشرية تدرس السكان والأنشطة الاقتصادية والعمران والتنقل."]]],"k":"الجغرافيا دراسة الظواهر الطبيعية والبشرية وتوزعها في المجال والعلاقات بينها."},{"t":"الخريطة وعناصرها","bs":[["العنوان يبين موضوع",["العنوان يبين موضوع الخريطة ومجالها."]],["المفتاح يفسر الرموز",["المفتاح يفسر الرموز والألوان المستخدمة."]],["المقياس يربط المسافة",["المقياس يربط المسافة على الخريطة بالمسافة الحقيقية."]],["الاتجاهات تساعد على",["الاتجاهات تساعد على تحديد المواقع؛ وغالبا يشير أعلى الخريطة إلى الشمال ما لم يوضح خلاف ذلك."]],["الإحداثيات أو أسماء",["الإحداثيات أو أسماء الأماكن تساعد على تحديد الموقع بدقة."]]],"k":"العنوان يبين موضوع الخريطة ومجالها."},{"t":"الموقع والتضاريس والمناخ","bs":[["الموقع الفلكي يحدد",["الموقع الفلكي يحدد بالإحداثيات، أما الموقع الجغرافي فيصف مكان المنطقة بالنسبة إلى ما يحيط بها."]],["من أشكال التضاريس",["الجبال والهضاب والسهول والأحواض."]],["الطقس حالة الجو",["الطقس حالة الجو خلال مدة قصيرة، أما المناخ فهو خصائص الجو المعتادة خلال مدة طويلة."]],["تؤثر التضاريس والارتفاع",["تؤثر التضاريس والارتفاع والقرب من البحر في خصائص المناخ وتوزيع السكان والأنشطة."]]],"k":"الموقع الفلكي يحدد بالإحداثيات، أما الموقع الجغرافي فيصف مكان المنطقة بالنسبة إلى ما يحيط بها."},{"t":"السكان والأنشطة","bs":[["يتوزع السكان بشكل",["يتوزع السكان بشكل غير متساو بسبب عوامل طبيعية واقتصادية وتاريخية."]],["تجذب بعض المناطق",["تجذب بعض المناطق السكان بسبب فرص العمل والمياه والخدمات وسهولة النقل."]],["من الأنشطة الاقتصادية",["الزراعة والصناعة والخدمات والتجارة."]],["تساعد الخرائط والرسوم",["تساعد الخرائط والرسوم البيانية والجداول في وصف التوزع والمقارنة بين المناطق."]]],"k":"يتوزع السكان بشكل غير متساو بسبب عوامل طبيعية واقتصادية وتاريخية."},{"t":"منهجية الإجابة في الجغرافيا","bs":[["اقرأ عنوان الوثيقة",["اقرأ عنوان الوثيقة ومفتاحها ومقياسها قبل تفسيرها."]],["استخرج معلومة محددة",["استخرج معلومة محددة من الخريطة أو الجدول، ثم فسّرها بعامل مناسب إذا طُلب منك ذلك."]],["عند المقارنة، اذكر",["عند المقارنة، اذكر أوجه التشابه والاختلاف بوضوح ولا تكتف بعبارة عامة."]]],"k":"اقرأ عنوان الوثيقة ومفتاحها ومقياسها قبل تفسيرها."}]},"islam":{"name":"التربية الإسلامية","c":"#2e7d32","i":"🕌","L":[{"t":"القرآن الكريم وأدب التلاوة","bs":[["القرآن الكريم كلام",["القرآن الكريم كلام الله تعالى، وتلاوته عبادة."]],["من آداب التلاوة",["الإخلاص، الإنصات، احترام المصحف، والتدبر في المعاني."]],["عند حفظ سورة",["عند حفظ سورة مقررة، تُراجع من المصحف المدرسي وتُضبط ألفاظها كما وردت دون الاعتماد على الملخص وحده."]]],"k":"القرآن الكريم كلام الله تعالى، وتلاوته عبادة."},{"t":"الإيمان بالله تعالى","bs":[["الإيمان بالله هو",["الإيمان بالله هو التصديق بوجود الله تعالى وربوبيته وألوهيته وأسمائه وصفاته كما يليق به."]],["من آثار الإيمان",["مراقبة الله، الصدق، الأمانة، شكر النعم، والابتعاد عن الظلم."]],["تظهر العقيدة الصحيحة",["تظهر العقيدة الصحيحة في السلوك والعمل، لا في الكلام فقط."]]],"k":"الإيمان بالله هو التصديق بوجود الله تعالى وربوبيته وألوهيته وأسمائه وصفاته كما يليق به."},{"t":"أركان الإيمان","bs":[["الإيمان بالله، وملائكته،",["الإيمان بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، والقدر خيره وشره."]],["الإيمان بالملائكة تصديق",["الإيمان بالملائكة تصديق بوجودهم وأنهم عباد مكرمون لا يعصون الله فيما أمرهم."]],["الإيمان بالرسل يقتضي",["الإيمان بالرسل يقتضي تصديقهم واحترامهم والإيمان بما أرسلوا به."]]],"k":"الإيمان بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، والقدر خيره وشره."},{"t":"الطهارة والوضوء","bs":[["الطهارة تشمل رفع",["الطهارة تشمل رفع الحدث وإزالة النجاسة بحسب أحكامها."]],["من فرائض الوضوء",["من فرائض الوضوء في الفقه المالكي المتداول في الجزائر: النية، غسل الوجه، غسل اليدين إلى المرفقين، مسح الرأس، غسل الرجلين إلى الكعبين، والدلك والفور مع مراعاة التفصيل …"]],["يُستحسن الرجوع إلى",["يُستحسن الرجوع إلى شرح الأستاذ والكتاب المدرسي عند حفظ الفرائض والسنن ونواقض الوضوء، لأن تفاصيل التصنيف قد تختلف بين المذاهب."]]],"k":"الطهارة تشمل رفع الحدث وإزالة النجاسة بحسب أحكامها."},{"t":"الصلاة وأهميتها","bs":[["الصلاة ركن من",["الصلاة ركن من أركان الإسلام، وهي صلة بين العبد وربه."]],["يحافظ المسلم على",["يحافظ المسلم على أوقاتها وشروطها وأركانها ويتعلم أحكامها بالتدرج."]],["من آثار الصلاة",["تهذيب السلوك، تنظيم الوقت، وتعويد المسلم على الطاعة."]]],"k":"الصلاة ركن من أركان الإسلام، وهي صلة بين العبد وربه."},{"t":"الأخلاق الإسلامية","bs":[["الصدق مطابقة القول",["الصدق مطابقة القول للواقع، وهو سبب للثقة بين الناس."]],["الأمانة أداء الحقوق",["الأمانة أداء الحقوق وحفظ ما اؤتمن عليه الإنسان."]],["التعاون يكون على",["التعاون يكون على الخير والمصلحة، واحترام الآخرين من حسن الخلق."]],["تطبيق",["إذا وجدت غرضا ليس لك، فابحث عن صاحبه أو سلّمه للمسؤول بدل الاحتفاظ به."]]],"k":"الصدق مطابقة القول للواقع، وهو سبب للثقة بين الناس."},{"t":"بر الوالدين واحترام الآخرين","bs":[["بر الوالدين يكون",["بر الوالدين يكون بالكلام الطيب والطاعة في المعروف ومساعدتهما."]],["يُحترم المعلم والجيران",["يُحترم المعلم والجيران والزملاء، ويُبتعد عن السخرية والغيبة والإيذاء."]],["لا طاعة لمخلوق",["لا طاعة لمخلوق في معصية الخالق، ويكون الاختلاف بأدب وحكمة."]]],"k":"بر الوالدين يكون بالكلام الطيب والطاعة في المعروف ومساعدتهما."},{"t":"السيرة النبوية والاقتداء","bs":[["نتعلم من سيرة",["نتعلم من سيرة النبي محمد صلى الله عليه وسلم الصدق والرحمة والصبر والوفاء بالعهد."]],["الاقتداء بالسيرة يكون",["الاقتداء بالسيرة يكون بتطبيق الأخلاق في البيت والمدرسة والمجتمع."]],["عند مراجعة حدث",["عند مراجعة حدث تاريخي محدد، احفظ أسباب الحدث ووقائعه ونتائجه كما وردت في الكتاب المدرسي."]]],"k":"نتعلم من سيرة النبي محمد صلى الله عليه وسلم الصدق والرحمة والصبر والوفاء بالعهد."},{"t":"العبادة والمسؤولية","bs":[["العبادة تشمل أعمالا",["العبادة تشمل أعمالا ظاهرة وأعمالا قلبية، وتنعكس على سلوك المسلم."]],["المسؤولية تعني أداء",["المسؤولية تعني أداء الواجبات وتحمل نتائج التصرفات."]],["من أمثلة المسؤولية",["المحافظة على أدوات المدرسة، الصدق في الواجب، ومساعدة المحتاج بما تستطيع."]]],"k":"العبادة تشمل أعمالا ظاهرة وأعمالا قلبية، وتنعكس على سلوك المسلم."}]},"civic":{"name":"التربية المدنية","c":"#1565c0","i":"🏛️","L":[{"t":"الفرد والجماعة","bs":[["الفرد شخص له",["الفرد شخص له حقوق وعليه واجبات، ويعيش ضمن جماعات مثل الأسرة والمدرسة والمجتمع."]],["تقوم الحياة الجماعية",["تقوم الحياة الجماعية على التعاون والاحترام وتحمل المسؤولية."]],["احترام الاختلاف في",["احترام الاختلاف في الآراء والقدرات يساعد على التعايش ويقلل النزاعات."]]],"k":"الفرد شخص له حقوق وعليه واجبات، ويعيش ضمن جماعات مثل الأسرة والمدرسة والمجتمع."},{"t":"الأسرة ودورها","bs":[["توفر الأسرة الرعاية",["توفر الأسرة الرعاية والتربية والتوجيه والحماية لأفرادها."]],["من واجبات الأبناء",["من واجبات الأبناء احترام الوالدين، المساعدة حسب الاستطاعة، والمحافظة على الحوار الهادئ."]],["تُحل الخلافات الأسرية",["تُحل الخلافات الأسرية بالحوار والتفاهم وطلب المساعدة من شخص موثوق عند الحاجة."]]],"k":"توفر الأسرة الرعاية والتربية والتوجيه والحماية لأفرادها."},{"t":"المدرسة والحياة المدرسية","bs":[["من حقوق التلميذ",["من حقوق التلميذ التعلم في بيئة آمنة واحترام كرامته."]],["من واجباته احترام",["من واجباته احترام المعلمين والزملاء، المحافظة على الممتلكات، الالتزام بالنظام الداخلي، وإنجاز العمل المدرسي."]],["الممتلكات العامة مثل",["الممتلكات العامة مثل الطاولات والكتب والأدوات المشتركة مسؤولية الجميع."]]],"k":"من حقوق التلميذ التعلم في بيئة آمنة واحترام كرامته."},{"t":"الحقوق والواجبات","bs":[["كيف نميز بينهما؟",["كيف نميز بينهما؟"]],["الحق منفعة أو",["الحق منفعة أو حماية يقرها القانون أو القواعد المنظمة للمجتمع."]],["الواجب مسؤولية ينبغي",["الواجب مسؤولية ينبغي أداؤها تجاه النفس والآخرين والمجتمع."]],["الحقوق والواجبات متكاملة،",["الحقوق والواجبات متكاملة، ولا يبرر حق الفرد الاعتداء على حقوق غيره."]],["مثال",["للتلميذ حق التعلم، وعليه واجب احترام النظام المدرسي وعدم تعطيل تعلم الآخرين."]]],"k":"كيف نميز بينهما؟"},{"t":"الحوار وحل النزاعات","bs":[["الاستماع دون مقاطعة،",["الاستماع دون مقاطعة، وشرح المشكلة بهدوء، واحترام الطرف الآخر."]],["البحث عن حل",["البحث عن حل عادل ومقبول وتجنب السب والعنف."]],["إذا تعذر الحل،",["إذا تعذر الحل، يمكن اللجوء إلى المعلم أو الإدارة أو شخص بالغ موثوق."]]],"k":"الاست const TG={"mec":{"key":"genie-mecanique","map":"gmec","name":"الهندسة الميكانيكية","c":"#455a64","i":"⚙️","L":[{"i":"📐","t":"قراءة الرسم التقني والإنشاء","B":[["ماذا نقرأ أولا؟",["عنوان الرسم وجدول البيانات","المقياس والمساقط والمقاطع","الأبعاد والتفاوتات المكتوبة"]],["المقياس",["الطبيعي `1:1`","التصغير مثل `1:2`","التكبير مثل `2:1`"]],["الرسم التجميعي",["حدد كل قطعة برقمها","استخرج وظيفتها","حدد علاقات التلامس والتثبيت"]],["المسقط والمقطع",["المسقط يمثل الشكل الخارجي","المقطع يكشف الداخل بقطع وهمي","خطوط التهشير تدل على المادة المقطوعة"]],["أخطاء شائعة",["قياس البعد من الورقة رغم أنه مكتوب","الخلط بين التصغير والتكبير","تجاهل التفاوتات"]]],"X":"الرسم التقني لغة عالمية بين المصمم والعامل. قبل أي حل اقرأ العنوان والمقياس ثم المساقط. تذكر أن البعد المكتوب هو المرجع دائما، أما الورقة فقد تكون مصغرة أو مكبرة.","M":["الطول المرسوم = الطول الحقيقي × المقياس.","البعد المكتوب أولى من البعد المقاس.","في التجميعي ابدأ بالترقيم ثم الوظيفة ثم الوصلات."],"EX":[["المقياس `1:2` والطول الحقيقي للقطعة `80 mm`. ما طولها المرسوم؟","المقياس `1:2` تصغير بالنصف. الطول المرسوم `80 × 1/2 = 40 mm`."],["ما الفرق بين المسقط والمقطع؟ ولماذا تُستعمل خطوط التهشير؟","المسقط يعرض الشكل الخارجي كما نراه. والمقطع نتخيل فيه قطع القطعة بمستو لإظهار الداخل. خطوط التهشير تبين الأجزاء المقطوعة من المادة فنفرق بينها وبين الفراغات."],["قطعة طولها الحقيقي `120 mm` رُسمت بمقياس `2:1`. ما طولها المرسوم؟","المقياس `2:1` تكبير مرتين. الطول المرسوم `120 × 2 = 240 mm`."]],"K":"الطول المرسوم = الحقيقي × المقياس. البعد المكتوب هو المرجع. المقطع يكشف الداخل وتهشيره يدل على المادة."},{"i":"🔩","t":"الوصلات الميكانيكية ودرجات الحرية","B":[["الوصلة",["تربط قطعتين","تسمح بحركات نسبية محددة","وتمنع حركات أخرى"]],["أنواع الوصلات",["ثابتة (لا حركة)","محورية دورانية","انزلاقية"]],["وصلات أخرى",["لولبية (دوران وانتقال معا)","كروية (دوران حول نقطة)","متمحورة بالتدحرج"]],["كيف أحلل آلية؟",["اذكر القطع المتصلة","نوع الوصلة","الحركة المسموحة والممنوعة"]],["المحامل",["توجه الدوران","تقلل الاحتكاك","يُختار نوعها حسب الحمل والسرعة والدقة"]]],"X":"كل وصلة قاعدة لعبة بين قطعتين: ما الذي يُسمح لإحداهما بفعله بالنسبة للأخرى. الباب مع إطاره يدور فقط، والمنزلق على سكة ينتقل فقط في اتجاه واحد. لا تخلط بين حركة القطعة وحركة نقطة عليها.","M":["لكل وصلة: حركة مسموحة وحركات ممنوعة.","حركة القطعة غير حركة نقطة منها.","اختر المحمل بحسب الحمل والسرعة والدقة."],"EX":[["محور يدور داخل محمل. ما الحركة المسموحة؟","الحركة المسموحة هي الدوران حول محور المحمل فقط. أما الانتقالات الأخرى فتُمنع بحسب التركيب. الوصلة محورية دورانية."],["حدّد نوع الوصلة بين باب وإطاره، وبين منزلق وسكة خطية.","الباب والإطار: وصلة محورية (دورانية) حول محور المفصلة. المنزلق والسكة: وصلة انزلاقية، انتقال في اتجاه السكة فقط."],["ما فائدة المحمل في آلية تدور؟","يوجه الدوران ويقلل الاحتكاك ويتحمل الأحمال. ويُختار حسب الحمل والسرعة والدقة المطلوبة."]],"K":"وصلة = حركة مسموحة + حركات ممنوعة. دورانية، انزلاقية، لولبية، كروية، ثابتة. المحمل يوجه الدوران ويقلل الاحتكاك."},{"i":"⛓️","t":"مقاومة المواد: الشد والضغط","B":[["الإجهاد العادي",["`σ = N/S`","`N` بالنيوتن و `S` بـ `m²` فالإجهاد بـ `Pa`","أو `N/mm²` وهو يساوي `MPa`"]],["الاستطالة المرنة",["`ΔL = N·L/(E·S)`","`E` معامل يونغ","`L` الطول الأصلي"]],["شرط المقاومة",["`σ ≤ σ_adm`","الإجهاد المحسوب أقل من المسموح","وحدات متجانسة دائما"]],["حالة الشد والضغط",["الشد يطيل القضيب","الضغط يقصّره","`N` موجبة للشد وسالبة للضغط عادة"]],["أخطاء شائعة",["خلط `mm²` مع `m²`","خلط `N` مع `kN`","نسيان مقارنة `σ` بـ `σ_adm`"]]],"X":"القوة المحورية تشد القضيب أو تضغطه. نقسمها على مساحة المقطع لنعرف الإجهاد، أي القوة لكل وحدة مساحة. إن كان الإجهاد أقل من الإجهاد الذي تتحمله المادة فالقطعة آمنة.","M":["حوّل `kN` إلى `N` أولا: `1 kN = 1000 N`.","مع `mm²` تكون النتيجة بـ `MPa` مباشرة.","اكتب الشرط `σ ≤ σ_adm` واستنتج."],"EX":[["قضيب مساحته `100 mm²` تؤثر عليه قوة شد `10 kN`. احسب الإجهاد.","`σ = 10000/100 = 100 N/mm² = 100 MPa`."],["قضيب مساحته `200 mm²` يتعرض إلى `12 kN`. احسب الإجهاد بوحدة `MPa`.","`N = 12 kN = 12000 N`. `σ = 12000/200 = 60 MPa`."],["قضيب فولاذي طوله `2 m` ومساحته `200 mm²` وقوة الشد `20 kN` و `E = 200000 MPa`. احسب الاستطالة.","`ΔL = N·L/(E·S) = 20000 × 2000/(200000 × 200) = 40000000/40000000 = 1 mm`."]],"K":"`σ = N/S` و `ΔL = N·L/(E·S)`. الشرط `σ ≤ σ_adm`. N/mm² = MPa."},{"i":"🔧","t":"القص والانحناء والالتواء","B":[["القص",["قوى متعاكسة متقاربة على المقطع","`τ = T/S`","مثل مسمار أو برشام"]],["الانحناء",["أحمال عرضية تولد عزم انحناء","ألياف جانب في الشد والجانب الآخر في الضغط","استعمل مخططات العزم"]],["الالتواء",["عزم حول محور العمود","يظهر في أعمدة نقل الحركة","يرتبط بالقدرة والسرعة الزاوية"]],["القدرة الدورانية",["`P = C·ω`","`C` عزم الدوران بـ `N·m`","`ω` بـ `rad/s`"]],["تحويل السرعة",["`ω = 2π·n/60`","`n` بـ `tr/min`","`1 tr/min = 0.1047 rad/s`"]]],"X":"القص يحدث عندما تحاول قوتان متعاكستان قص المقطع كما تقص المقص الورقة. الانحناء يثني العنصر فيشد جانبا ويضغط جانبا. الالتواء يلوي العمود حول محوره وهو يرتبط بالقدرة التي ينقلها.","M":["القص: قسّم القوة على مساحة المقطع المقصوص.","القدرة = العزم × السرعة الزاوية.","حوّل tr/min إلى rad/s قبل الحساب."],"EX":[["حوّل سرعة `300 tr/min` إلى `rad/s` باستعمال `ω = 2πn/60`.","`ω = 2π × 300/60 = 10π ≈ 31.4 rad/s`."],["مسمار يتعرض لقوة قص `6 kN` ومساحة مقطعه `50 mm²`. احسب `τ`.","`τ = T/S = 6000/50 = 120 N/mm² = 120 MPa`."],["عمود ينقل عزما `C = 20 N·m` بسرعة `300 tr/min`. احسب القدرة.","`ω ≈ 31.4 rad/s`. `P = C·ω = 20 × 31.4 ≈ 628 W`."]],"K":"`τ = T/S` و `P = C·ω` و `ω = 2πn/60`. الانحناء: شد في جانب وضغط في الجانب الآخر."},{"i":"🔁","t":"نقل الحركة والقدرة والمردود","B":[["زوج تروس",["`n_1·Z_1 = n_2·Z_2`","`n` السرعة و `Z` عدد الأسنان","اتجاها الدوران متعاكسان في الخارجي"]],["نسبة النقل",["`r = n_2/n_1 = Z_1/Z_2`","حسب اصطلاح الدرس","اكتب العلاقة المستعملة دائما"]],["المردود",["`η = P_u/P_a`","`P_u` المفيدة و `P_a` الممتصة","`η ≤ 1` في النظام الحقيقي"]],["الضياعات",["الاحتكاك","الحرارة","`P_a = P_u + P_{pertes}` (الضياعات)"]],["أخطاء شائعة",["عكس نسبة النقل","خلط المدخل والمخرج","قول إن المردود أكبر من 1"]]],"X":"الترس الصغير يدور أسرع من الكبير المتصل به. حاصل ضرب السرعة في عدد الأسنان ثابت. أما المردود فهو نسبة ما أخذناه فعلا من الآلة إلى ما أعطيناها، وهو دائما أقل من 1 بسبب الضياعات.","M":["ابدأ بتحديد المدخل والمخرج.","`n_2 = n_1·Z_1/Z_2`.","المردود يُعطى نسبة أو مئوية."],"EX":[["`Z_1 = 20` و `Z_2 = 60` و `n_1 = 900 tr/min`. احسب `n_2`.","`n_2 = n_1·Z_1/Z_2 = 900 × 20/60 = 300 tr/min`."],["آلة تستقبل `500 W` وتقدم `400 W` مفيدة. احسب مردودها.","`η = 400/500 = 0.8` أي `80%`. الضياعات `100 W`."],["`Z_1 = 18` و `Z_2 = 54` و `n_1 = 1200 tr/min`. احسب `n_2` ونسبة النقل.","`n_2 = 1200 × 18/54 = 400 tr/min`. نسبة النقل `n_2/n_1 = 400/1200 = 1/3`. الترس الثاني أبطأ ثلاث مرات."]],"K":"`n_1·Z_1 = n_2·Z_2` و `η = P_u/P_a ≤ 1`. حدد المدخل والمخرج أولا."},{"i":"🏭","t":"الإنتاج والتصنيع","B":[["العمليات",["السباكة والتشكيل","التشغيل بالقطع","اللحام والمعالجة الحرارية"]],["الخراطة",["القطعة تدور غالبا","الأداة تتحرك","سطوح أسطوانية دقيقة"]],["التفريز",["الأداة تدور","القطعة أو الطاولة تتحرك","سطوح مستوية وأخاديد"]],["معايير الاختيار",["المادة والشكل","الدقة وجودة السطح","التكلفة والكمية"]],["السلامة والجودة",["نظارات واقية وتثبيت القطعة","عدم ارتداء قفازات قرب الأجزاء الدوارة","مراقبة الأبعاد والتفاوتات"]]],"X":"نختار طريقة التصنيع بحسب الشكل المطلوب والدقة والتكلفة. القطعة الدوارة ذات السطح الأسطواني تناسبها الخراطة، والسطوح المستوية تناسبها آلة التفريز. وتبقى السلامة أولا في كل ورشة.","M":["ربط العملية بالشكل المطلوب.","قارن الدقة والتكلفة.","اذكر دائما إجراءات السلامة."],"EX":[["أي عملية تناسب سطحا أسطوانيا خارجيا دقيقا على قطعة دوارة؟","الخراطة، لأن القطعة تدور وتتحرك أداة القطع على طولها فتعطي سطحا أسطوانيا دقيقا."],["اختر عملية مناسبة لثقب قطعة معدنية، ثم اذكر إجراءي سلامة.","العملية: الثقب بالمثقاب على آلة الثقب. السلامة: ارتداء نظارات واقية، وتثبيت القطعة جيدا في الملزمة دون حملها باليد، وعدم ارتداء قفازات قرب المثقاب الدوار."],["ما الفرق بين الخراطة والتفريز من حيث الحركة؟","في الخراطة تدور القطعة وتتحرك الأداة. وفي التفريز تدور الأداة وتتحرك القطعة أو الطاولة."]],"K":"خراطة: القطعة تدور. تفريز: الأداة تدور. اختر العملية بالشكل والدقة والتكلفة. السلامة أولا."}],"O":[{"t":"نقل الح سلة المعلومات","نسيان مسبق المشغل"]]],"X":"تخيل نظاما آليا كإنسان: الحواس (الحساسات) ترسل معلومة إلى الدماغ (وحدة التحكم) الذي يعطي أمرا للعضلات (المشغلات) فتتحرك. الأوامر تمر عبر سلسلة المعلومات، أما القوة فتمر عبر سلسلة الطاقة.","M":["الحساس يكتشف، وحدة التحكم تقرر، مسبق المشغل يوزع، المشغل ينفذ.","ارسم المخطط: حساس ثم تحكم ثم مسبق مشغل ثم مشغل.","قد تختلف العناصر من نظام لآخر."],"EX":[["صنّف حساس نهاية الشوط، وحدة التحكم، المحرك، وموزع القدرة ضمن السلسلتين.","حساس نهاية الشوط: سلسلة المعلومات (اكتساب). وحدة التحكم: سلسلة المعلومات (معالجة). موزع القدرة (المرحل): سلسلة الطاقة (توزيع). المحرك: سلسلة الطاقة (عضو منفذ يحول الطاقة)."],["في باب آلي، صف تسلسل الإشارة من فتح الباب إلى حركته.","الحساس يكشف الشخص ويرسل معلومة. وحدة التحكم تقرر الفتح. المرحل أو الموزع يوجه الطاقة. المحرك يحرك الباب. وعند نهاية الشوط يرسل الحساس معلومة للإيقاف."],["ما الفرق بين الحساس والمشغل؟","الحساس يحول كمية فيزيائية إلى إشارة (معلومة). أما المشغل فيحول الطاقة إلى فعل مادي (حركة، حرارة، ...)."]],"K":"معلومات: حساس ثم تحكم. طاقة: تغذية، توزيع، تحويل، عضو منفذ. الحساس يكتشف والمشغل ينفذ."},{"i":"🔌","t":"أساسيات الدارات الكهربائية","B":[["قانون أوم",["`U = R·I`","`U` بالفولت و `I` بالأمبير و `R` بالأوم","للمقاومة فقط"]],["القدرة",["`P = U·I`","`P = R·I²`","`P = U²/R`"]],["التوالي",["التيار نفسه في العناصر","الجهد الكلي مجموع الجهود","`R = R_1 + R_2`"]],["التوازي",["الجهد نفسه على الفروع","التيارات تتجمع","`1/R = 1/R_1 + 1/R_2`"]],["أخطاء شائعة",["خلط `mA` مع `A`","استعمال علاقة توالي في توازي","نسيان وحدة القدرة `W`"]]],"X":"قانون أوم يقول إن التيار يزيد عندما يزيد الجهد ويقل عندما تزيد المقاومة. القدرة هي سرعة استهلاك الطاقة. في التوالي كل العناصر تتقاسم نفس التيار، وفي التوازي كل الفروع تتقاسم نفس الجهد.","M":["اكتب المعطيات بالوحدات الأساسية.","اختر علاقة القدرة المناسبة للمعطيات.","حدد التوالي أو التوازي قبل الحل."],"EX":[["مقاومة `12 Ω` تحت توتر `24 V`. احسب التيار والقدرة.","`I = U/R = 24/12 = 2 A`. `P = U·I = 24 × 2 = 48 W`."],["احسب التيار في مقاومة `30 Ω` موصولة بمصدر `15 V`.","`I
