const TP={"name":"العلوم الفيزيائية","c":"#1565c0","i":"⚛️","L":[{"i":"🍎","t":"قوانين نيوتن","B":[["القانون الأول (العطالة)",["`ΣF = 0` فالجسم ساكن أو في حركة مستقيمة منتظمة","الحفاظ على الحالة الحركية","يُطبق في معلم غاليلي"]],["القانون الثاني",["`ΣF = m·a`","التسارع في اتجاه محصلة القوى","`m` بالكيلوغرام و `F` بالنيوتن"]],["القانون الثالث",["الفعل ورد الفعل متساويان ومتعاكسان","`F_{A/B} = -F_{B/A}`","يؤثران على جسمين مختلفين"]],["منهج الحل",["1) حدد الجملة والمعلم","2) مثّل القوى","3) طبّق القانون الثاني وسقط على المحاور"]],["أخطاء شائعة",["خلط القوة بالسرعة","نسيان قوة أو إشارتها","اعتبار الفعل ورد الفعل على نفس الجسم"]]],"X":"كل جسم يقاوم تغيير حركته (العطالة). إذا أردنا تغيير سرعته نحتاج قوة محصلة، وكلما كانت كتلته أكبر احتجنا قوة أكبر لنفس التسارع. والقوة لا تأتي وحدها: كل جسم يدفع جسما آخر يُدفع في المقابل.","M":["ارسم القوى قبل أي معادلة.","سقّط المعادلة الشعاعية على محورين.","تسارع ثابت يعني حركة متغيرة بانتظام."],"EX":[["جسم كتلته `2 kg` تؤثر عليه قوتان `10 N` و `4 N` متعاكستان على نفس الحامل. احسب تسارعه.","المحصلة `10 - 4 = 6 N`. `a = ΣF/m = 6/2 = 3 m/s^{2}` في اتجاه القوة الأكبر."],["جسم كتلته `5 kg` على مستو مائل أملس بزاوية `30°`. احسب تسارعه (`g = 9.8`).","القوة المؤثرة على امتداد المستوي `P·sin α = m·g·sin α`. `a = g·sin 30° = 9.8 × 0.5 = 4.9 m/s^{2}`."],["سيارة كتلتها `1000 kg` تنتقل من السكون إلى `20 m/s` خلال `10 s` بتسارع ثابت. احسب القوة المحصلة.","`a = Δv/Δt = 20/10 = 2 m/s^{2}`. `ΣF = m·a = 1000 × 2 = 2000 N`."]],"K":"`ΣF = m·a`. إذا `ΣF = 0` فحركة مستقيمة منتظمة أو سكون. فعل = رد فعل في المقدار ومعاكس في الاتجاه."},{"i":"🪂","t":"السقوط الشاقولي ودافعة أرخميدس","B":[["السقوط الحر",["القوة الوحيدة الثقل `P = m·g`","`a = g` ثابت","`v = g·t` و `y = (1/2)·g·t^{2}`"]],["دافعة أرخميدس",["`Π = ρ_{fl}·V·g`","موجهة نحو الأعلى","`V` حجم الجزء المغمور"]],["السقوط في مائع",["الثقل `P` والدافعة `Π` والاحتكاك `f = k·v`","المعادلة التفاضلية للسرعة","تبلغ السرعة قيمة حدية"]],["السرعة الحدية",["تنعدم المحصلة: `P - Π - k·v_{lim} = 0`","`v_{lim} = (P - Π)/k`","حركة مستقيمة منتظمة بعدها"]],["أخطاء شائعة",["إهمال الدافعة في الماء","خلط حجم الجسم والجزء المغمور","نسيان اتجاه الاحتكاك"]]],"X":"عندما نترك جسما في الفراغ يسقط بتسارع ثابت g. في مائع نضيف قوتين: الدافعة تدفع للأعلى والاحتكاك يزيد مع السرعة. عندما تتوازن القوى تتوقف السرعة عن الازدياد وتصبح ثابتة: هي السرعة الحدية.","M":["ارسم الثقل والدافعة والاحتكاك.","للسرعة الحدية ضع `a = 0`.","في السقوط الحر الكتلة لا تؤثر في الزمن."],"EX":[["حجر يُترك من ارتفاع `20 m` (`g = 9.8`). احسب زمن السقوط والسرعة عند الأرض.","`h = (1/2)g·t^{2}` فـ `t = √(2h/g) = √(40/9.8) ≈ 2.02 s`. `v = g·t ≈ 19.8 m/s`."],["جسم حجمه `2 L` مغمور كليا في الماء (`ρ = 1000 kg/m^{3}`). احسب دافعة أرخميدس.","`V = 2×10^{-3} m^{3}`. `Π = 1000 × 2×10^{-3} × 9.8 = 19.6 N`."],["كرة ثقلها `2 N` ودافعتها `0.5 N` وثابت الاحتكاك `k = 3 kg/s`. احسب السرعة الحدية.","`v_{lim} = (P - Π)/k = (2 - 0.5)/3 = 0.5 m/s`."]],"K":"سقوط حر: `a = g`. `Π = ρ·V·g`. سرعة حدية: `P - Π - k·v = 0`."},{"i":"🏹","t":"حركة القذيفة","B":[["المعادلات الزمنية",["`x = (v_0·cos α)·t`","`y = -(1/2)g·t^{2} + (v_0·sin α)·t`","`a_x = 0` و `a_y = -g`"]],["المسار",["قطع مكافئ","`y = -g·x^{2}/(2v_0^{2}cos^{2}α) + x·tan α`","في مجال ثقالة منتظم"]],["القمة والمدى",["الارتفاع الأقصى `h = v_0^{2}sin^{2}α/(2g)`","المدى `R = v_0^{2}sin 2α/g`","زمن الطيران `t = 2v_0 sin α/g`"]],["إطلاق أفقي",["`v_y(0) = 0`","`t = √(2h/g)`","`x = v_0·t`"]],["أخطاء شائعة",["خلط `cos` و `sin`","نسيان الإشارة السالبة لـ `g`","استعمال السرعة الابتدائية كاملة على المحورين"]]],"X":"القذيفة تتحرك في اتجاهين مستقلين: أفقيا بسرعة ثابتة وشاقوليا بتسارع الثقالة. نفصل الحركتين ثم نجمعهما في معادلة المسار. أعلى نقطة تكون عندما تنعدم السرعة الشاقولية.","M":["حلّل `v_0` إلى مركبتين.","عند القمة `v_y = 0`.","المدى أعظمي عند `α = 45°`."],"EX":[["قذيفة سرعتها `20 m/s` بزاوية `30°` (`g = 9.8`). احسب المدى والارتفاع الأقصى وزمن الطيران.","`R = 400 × sin 60°/9.8 = 400 × 0.866/9.8 ≈ 35.4 m`. `h = 400 × 0.25/19.6 ≈ 5.10 m`. `t = 2 × 20 × 0.5/9.8 ≈ 2.04 s`."],["جسم يُقذف أفقيا بسرعة `10 m/s` من ارتفاع `45 m`. أوجد زمن السقوط والمدى.","`t = √(2 × 45/9.8) = √9.18 ≈ 3.03 s`. `x = v_0·t = 10 × 3.03 ≈ 30.3 m`."],["ما الزاوية التي تعطي أكبر مدى؟ ولماذا؟","`R = v_0^{2}sin 2α/g` أعظمية عندما `sin 2α = 1` أي `α = 45°`."]],"K":"`x = v_0 cos α·t` و `y = -g t^{2}/2 + v_0 sin α·t`. `R = v_0^{2}sin 2α/g`. القمة: `v_y = 0`."},{"i":"🛰️","t":"حركة الكواكب والأقمار الاصطناعية","B":[["قانون الجذب",["`F = G·m_1·m_2/r^{2}`","`G = 6.67×10^{-11} SI`","قوة جاذبة متبادلة"]],["حركة دائرية منتظمة",["`v = √(G·M/r)`","`T = 2π·√(r^{3}/(G·M))`","التسارع جاذبي مركزي"]],["قوانين كبلر",["مسار الكوكب إهليلجي","المساحات المكتسحة متساوية في أزمنة متساوية","`T^{2}/r^{3} = 4π^{2}/(G·M)`"]],["القمر الجيو مستقر",["`T = 24 h` تقريبا","في المستوي الاستوائي","يظهر ثابتا في السماء"]],["أخطاء شائعة",["استعمال الارتفاع بدل `r`","نسيان تحويل `km` إلى `m`","الخلط بين كتلة القمر وكتلة الأرض"]]],"X":"القمر الاصطناعي يسقط دائما نحو الأرض لكنه يتحرك أفقيا بسرعة كبيرة فيخطئ الأرض باستمرار فيدور حولها. البعد عن مركز الأرض هو `r` وليس الارتفاع فقط. كلما كان المدار أعلى كانت السرعة أقل والدور أكبر.","M":["`r = R_T + h`.","السرعة لا تتعلق بكتلة القمر.","استعمل `T^{2}/r^{3}` ثابتا لمقارنة مدارين."],"EX":[["قمر على ارتفاع `400 km` (`M_T = 5.97×10^{24} kg`، `R_T = 6.37×10^{6} m`). احسب سرعته ودوره.","`r = 6.77×10^{6} m`. `v = √(6.67×10^{-11} × 5.97×10^{24}/6.77×10^{6}) = √(5.88×10^{7}) ≈ 7670 m/s`. `T = 2πr/v ≈ 5547 s ≈ 92.5 min`."],["أوجد نصف قطر مدار قمر جيو مستقر (`T = 86164 s`).","`r^{3} = G·M·T^{2}/4π^{2} = 3.98×10^{14} × 7.42×10^{9}/39.5 ≈ 7.49×10^{22}`. `r ≈ 4.22×10^{7} m`. الارتفاع `r - R_T ≈ 3.58×10^{7} m` أي `35800 km`."],["لماذا لا يسقط القمر الاصطناعي على الأرض؟","لأنه في سقوط حر مستمر نحو الأرض لكن بسرعة أفقية كبيرة فيدور حولها بدل أن يصطدم بها."]],"K":"`v = √(GM/r)` و `T = 2π√(r^{3}/GM)`. كبلر: `T^{2}/r^{3} = 4π^{2}/GM`. `r = R_T + h`."},{"i":"🔋","t":"ثنائي القطب RC","B":[["الشحن",["`u_C(t) = E(1 - e^{-t/τ})`","`i(t) = (E/R)·e^{-t/τ}`","التيار أعظمي عند البداية"]],["التفريغ",["`u_C(t) = E·e^{-t/τ}`","`i` عكسية الإشارة","يتناقص أسيا"]],["ثابت الزمن",["`τ = R·C`","عند `t = τ` تبلغ `u_C` نسبة `63%` من `E`","عند `t = 5τ` يُعتبر الشحن تاما"]],["الطاقة والشحنة",["`q = C·u_C`","`E_C = (1/2)C·u_C^{2}`","`u_C` متصلة دائما"]],["أخطاء شائعة",["خلط `τ` مع الزمن الكلي","نسيان وحدات `μF` و `kΩ`","قول إن `i` متصلة عند التبديل"]]],"X":"المكثفة كخزان ماء: تمتلئ بسرعة في البداية ثم ببطء. الزمن المميز `τ = RC` يحدد سرعة الامتلاء: مقاومة أكبر أو سعة أكبر تعني امتلاء أبطأ. التوتر بين طرفي المكثفة لا يقفز أبدا.","M":["`τ` بالثواني من `R` بالأوم و `C` بالفاراد.","عند `t = τ` الشحن `63%` والتفريغ يبقى `37%`.","في النظام الدائم لا يمر تيار في فرع المكثفة."],"EX":[["`R = 10 kΩ` و `C = 100 μF`. احسب `τ`.","`τ = R·C = 10^{4} × 10^{-4} = 1 s`."],["شحن مكثفة بـ `E = 12 V` مع `τ = 1 s`. احسب `u_C` عند `t = τ` والطاقة المخزنة النهائية (`C = 100 μF`).","`u_C(τ) = 12 × (1 - e^{-1}) = 12 × 0.632 ≈ 7.58 V`. `E_C = (1/2) × 10^{-4} × 144 = 7.2×10^{-3} J`."],["متى تبلغ `u_C = 9 V` علما أن `E = 12 V` و `τ = 1 s`؟","`9 = 12(1 - e^{-t/τ})` فـ `e^{-t/τ} = 0.25`. `t = τ·ln 4 ≈ 1.39 s`."]],"K":"شحن `u_C = E(1 - e^{-t/τ})`. تفريغ `u_C = E e^{-t/τ}`. `τ = RC`. `u_C` متصلة."},{"i":"🧲","t":"ثنائي القطب RL","B":[["إقامة التيار",["`i(t) = (E/R)(1 - e^{-t/τ})`","`u_L(t) = E·e^{-t/τ}`","`i` متصلة دائما"]],["ثابت الزمن",["`τ = L/R`","عند `t = τ` يبلغ `i` نسبة `63%` من قيمته النهائية","`L` بالهنري"]],["القوة المحركة الذاتية",["`u_L = L·di/dt + r·i`","تعاكس تغير التيار","في النظام الدائم `u_L = r·i`"]],["الطاقة",["`E_L = (1/2)L·i^{2}`","مخزنة في الحقل المغناطيسي","لا تتغير فجأة"]],["أخطاء شائعة",["خلط `τ = L/R` مع `RC`","اعتبار التيار يقفز","إهمال المقاومة الداخلية للوشيعة"]]],"X":"الوشيعة تقاوم تغير التيار: لا تسمح له بالارتفاع أو الانخفاض فجأة. لذلك يرتفع التيار تدريجيا نحو `E/R` بزمن مميز `L/R`. وهي تخزن الطاقة في حقل مغناطيسي.","M":["`τ = L/R` ثانية.","النظام الدائم: `i = E/R` و `u_L = 0` (وشيعة مثالية).","التيار متصل والتوتر قد يقفز."],"EX":[["وشيعة `L = 0.5 H` ومقاومة `R = 50 Ω`. احسب `τ`.","`τ = L/R = 0.5/50 = 0.01 s = 10 ms`."],["في الدارة السابقة `E = 10 V`. احسب التيار النهائي والطاقة المخزنة.","`I = E/R = 10/50 = 0.2 A`. `E_L = (1/2) × 0.5 × 0.2^{2} = 0.01 J`."],["احسب التيار عند `t = τ`.","`i = 0.2 × (1 - e^{-1}) = 0.2 × 0.632 ≈ 0.126 A`."]],"K":"`τ = L/R`. `i = (E/R)(1 - e^{-t/τ})`. `E_L = (1/2)L i^{2}`. التيار متصل."},{"i":"〰️","t":"الدارة RLC والاهتزازات الكهربائية","B":[["الدارة المثالية LC",["اهتزازات جيبية دائمة","`T_0 = 2π·√(L·C)`","`f_0 = 1/T_0`"]],["الدارة RLC",["المقاومة تضيع الطاقة (جول)","اهتزازات متخامدة","أنظمة: دورية، لادورية، حرجة"]],["الطاقة",["`E = (1/2)C·u_C^{2} + (1/2)L·i^{2}`","تنحفظ إذا `R = 0`","تتناقص إذا `R ≠ 0`"]],["المعادلة التفاضلية",["`L·d^{2}q/dt^{2} + R·dq/dt + q/C = 0`","LC: `d^{2}q/dt^{2} + q/(LC) = 0`","حلها `q = Q_m cos(2πt/T_0 + φ)`"]],["أخطاء شائعة",["الخلط بين `T_0` و `τ`","نسيان الجذر التربيعي","اعتبار الطاقة منحفظة مع وجود `R`"]]],"X":"الدارة LC تشبه نابضا: الطاقة تنتقل بين المكثفة (طاقة كهربائية) والوشيعة (طاقة مغناطيسية) ذهابا وإيابا. إذا لم تكن هناك مقاومة لا تضيع الطاقة فتستمر الاهتزازات. المقاومة تحول الطاقة إلى حرارة فتخمد الاهتزازات.","M":["`T_0 = 2π√(LC)` بالثانية.","الطاقة الكلية تساوي الطاقة العظمى للمكثفة.","التخامد = ضياع بمفعول جول."],"EX":[["`L = 0.1 H` و `C = 10 μF`. احسب `T_0` و `f_0`.","`LC = 0.1 × 10^{-5} = 10^{-6}`. `T_0 = 2π × 10^{-3} ≈ 6.28 ms`. `f_0 = 1/T_0 ≈ 159 Hz`."],["في نفس الدارة شُحنت المكثفة تحت `6 V` (مثالية). احسب الطاقة الكلية والتيار الأعظمي.","`E = (1/2) × 10^{-5} × 36 = 1.8×10^{-4} J`. `I_m = √(2E/L) = √(3.6×10^{-4}/0.1) = √(3.6×10^{-3}) ≈ 0.06 A`."],["لماذا تتخامد الاهتزازات في دارة RLC؟","لأن المقاومة تحول جزءا من الطاقة إلى حرارة بمفعول جول فتتناقص الطاقة الكلية والسعة."]],"K":"`T_0 = 2π√(LC)`. الطاقة `E = C u^{2}/2 + L i^{2}/2`. المقاومة تخمد."},{"i":"🪀","t":"المتذبذبات الميكانيكية","B":[["النواس المرن",["`T_0 = 2π·√(m/k)`","`k` ثابت صلابة النابض","`x = X_m·cos(2πt/T_0 + φ)`"]],["النواس البسيط",["`T_0 = 2π·√(l/g)`","زوايا صغيرة","لا يتعلق بالكتلة"]],["المعادلة التفاضلية",["`d^{2}x/dt^{2} + (k/m)x = 0`","حركة جيبية","`ω_0 = √(k/m)`"]],["الطاقة",["`E = (1/2)k·x^{2} + (1/2)m·v^{2}`","تنحفظ بدون احتكاك","`E = (1/2)k·X_m^{2}`"]],["أخطاء شائعة",["الخلط بين `T_0` و `f_0`","استعمال الكتلة في النواس البسيط","`l` غير بالمتر"]]],"X":"النابض يحاول إرجاع الكتلة إلى موضع التوازن فتتحرك ذهابا وإيابا. الدور يزداد بزيادة الكتلة (أثقل فأبطأ) وينقص بزيادة الصلابة (أقوى فأسرع). والنواس البسيط يتحكم فيه الطول والثقالة فقط.","M":["`T_0` بالثواني.","`ω_0 = 2π/T_0`.","للتحقق: الطاقة الكلية ثابتة."],"EX":[["نابض `k = 20 N/m` وكتلة `m = 0.2 kg`. احسب الدور الخاص.","`T_0 = 2π√(0.2/20) = 2π × 0.1 ≈ 0.628 s`."],["نواس بسيط طوله `1 m` (`g = 9.8`). احسب دوره.","`T_0 = 2π√(1/9.8) = 2π × 0.3194 ≈ 2.01 s`."],["ما طول نواس بسيط دوره `1 s`؟","`l = g·T_0^{2}/4π^{2} = 9.8/39.5 ≈ 0.248 m`."]],"K":"`T_0 = 2π√(m/k)` و `T_0 = 2π√(l/g)`. الطاقة: `k X_m^{2}/2`."},{"i":"🌊","t":"الأمواج الميكانيكية","B":[["تعريف الموجة",["انتشار اضطراب دون انتقال المادة","مستعرضة أو طولية","تحتاج وسطا ماديا"]],["العلاقات",["`v = λ/T = λ·f`","التأخر `τ = d/v`","`λ` طول الموجة بالمتر"]],["الوسط",["السرعة تتعلق بالوسط","التردد يتعلق بالمنبع","`λ` تتغير بتغير الوسط"]],["الانعراج",["تغير الاتجاه عند فتحة أو حاجز","يظهر عندما `a ≈ λ`","خاصية الأمواج"]],["أخطاء شائعة",["قول إن الموجة تنقل المادة","خلط `T` و `f`","نسيان تحويل `mm` إلى `m`"]]],"X":"الموجة تشبه ما يحدث في ملعب عندما تقف الجماهير بالتتابع: الاضطراب هو الذي يسافر وليس الأشخاص. سرعة الموجة تتعلق بالوسط، وترددها بالمنبع، وطول موجتها يساوي المسافة المقطوعة في دور واحد.","M":["`v = λ·f`.","التأخر بين نقطتين `= d/v`.","التردد لا يتغير عند تغيير الوسط."],"EX":[["صوت في الهواء `v = 340 m/s` وتردده `170 Hz`. احسب طول موجته.","`λ = v/f = 340/170 = 2 m`."],["موجة على حبل `v = 5 m/s` و `f = 2 Hz`. احسب `λ` وتأخر نقطة تبعد `10 m`.","`λ = 5/2 = 2.5 m`. `τ = d/v = 10/5 = 2 s`."],["سونار يستقبل الصدى بعد `0.8 s` في الماء (`v = 1500 m/s`). احسب العمق.","الذهاب والإياب: `d = v·t/2 = 1500 × 0.8/2 = 600 m`."]],"K":"`v = λ/T = λf`. `τ = d/v`. التردد للمنبع والسرعة للوسط."},{"i":"💡","t":"الأمواج الضوئية والانعراج","B":[["الطبيعة الموجية",["الضوء موجة كهرمغناطيسية","`c = 3×10^{8} m/s` في الفراغ","`λ` تتعلق بالوسط"]],["الانعراج بشق",["`θ ≈ λ/a` (بالراديان)","عرض البقعة المركزية `L = 2λD/a`","`a` عرض الشق"]],["قرينة الانكسار",["`n = c/v`","`λ = λ_0/n`","التردد ثابت"]],["التجربة",["شق أو خيط رفيع","شاشة على بعد `D`","بقعة مركزية وبقع جانبية"]],["أخطاء شائعة",["نسيان العامل 2 في عرض البقعة المركزية","وحدات `nm` و `mm`","اعتبار التردد يتغير في الوسط"]]],"X":"عندما يمر الضوء بفتحة ضيقة جدا يتوزع بدل أن يبقى حزمة رفيعة: هذا الانعراج، ودليل على طبيعته الموجية. كلما ضاق الشق اتسعت البقعة المركزية. وهذا يسمح بقياس طول الموجة.","M":["`L = 2λD/a`.","حوّل كل الأطوال إلى المتر.","`θ` صغيرة: `tan θ ≈ θ`."],"EX":[["شق عرضه `a = 0.1 mm` وضوء `λ = 600 nm` وشاشة على `D = 2 m`. احسب `θ` وعرض البقعة المركزية.","`θ = λ/a = 6×10^{-7}/10^{-4} = 6×10^{-3} rad`. `L = 2λD/a = 2 × 6×10^{-7} × 2/10^{-4} = 0.024 m = 2.4 cm`."],["أوجد عرض الشق الذي يعطي `L = 1 cm` مع `λ = 633 nm` و `D = 3 m`.","`a = 2λD/L = 2 × 633×10^{-9} × 3/0.01 ≈ 3.8×10^{-4} m = 0.38 mm`."],["ما طول موجة ضوء `λ_0 = 600 nm` في زجاج `n = 1.5`؟","`λ = λ_0/n = 600/1.5 = 400 nm`."]],"K":"`θ = λ/a` و `L = 2λD/a`. `n = c/v` و `λ = λ_0/n`. التردد ثابت."},{"i":"☢️","t":"التحولات النووية","B":[["النواة",["رمز النواة `X` مع `A` عدد النويات و `Z` عدد البروتونات","`A` عدد النويات و `Z` عدد البروتونات","انحفاظ `A` و `Z`"]],["التفكك الإشعاعي",["`N = N_0·e^{-λt}`","`t_{1/2} = ln 2/λ`","النشاط `A = λ·N`"]],["أنماط التفكك",["`α`: خروج `^{4}_{2}He`","`β^{-}`: خروج إلكترون","`γ`: طاقة دون تغير `A` و `Z`"]],["الطاقة",["`E = Δm·c^{2}`","`1 u = 931.5 MeV/c^{2}`","طاقة الربط لكل نوية"]],["أخطاء شائعة",["خلط `λ` مع `t_{1/2}`","عدم موازنة `A` و `Z`","نسيان وحدة `u`"]]],"X":"النواة غير المستقرة تتفكك عشوائيا لكن بنسبة ثابتة في الزمن: نصف العينة يتفكك كل نصف عمر. عندما تتحول نواة إلى أخرى تتغير الكتلة قليلا فتتحرر طاقة كبيرة وفق علاقة أينشتاين.","M":["وازن `A` ثم `Z`.","بعد `n` أنصاف أعمار: `N = N_0/2^{n}`.","حوّل `u` إلى `MeV` بـ `931.5`."],"EX":[["عينة نصف عمرها `8` أيام. ما نسبة المتبقي بعد `24` يوما؟ وما `λ`؟","`24/8 = 3` أنصاف أعمار فـ `N/N_0 = 1/2^{3} = 1/8`. `λ = ln 2/8 ≈ 0.0866 d^{-1}`."],["اكتب معادلة تفكك `α` لليورانيوم `^{238}_{92}U`.","`^{238}_{92}U → ^{234}_{90}Th + ^{4}_{2}He`. التحقق: `238 = 234 + 4` و `92 = 90 + 2`."],["تفاعل نقص كتلته `Δm = 0.03 u`. احسب الطاقة المحررة.","`E = 0.03 × 931.5 ≈ 27.9 MeV`."]],"K":"`N = N_0 e^{-λt}` و `t_{1/2} = ln 2/λ`. `E = Δm c^{2}`. انحفاظ `A` و `Z`."},{"i":"⏳","t":"المتابعة الزمنية للتحول الكيميائي","B":[["التقدم x",["جدول تقدم التفاعل","`x_{max}` عند اختفاء المتفاعل المحد","يربط الكميات بالتقدم"]],["سرعة التفاعل",["`v = (1/V)·dx/dt`","تتناقص مع الزمن عادة","ميل المماس لمنحنى `x(t)`"]],["زمن نصف التفاعل",["`x(t_{1/2}) = x_{max}/2`","يقيس سرعة التفاعل","أصغر ⟵ أسرع"]],["العوامل الحركية",["درجة الحرارة","التراكيز","الحفاز"]],["أخطاء شائعة",["خلط `x` مع التركيز","نسيان `V` في السرعة","تحديد `x_{max}` خطأ"]]],"X":"التحول الكيميائي يتم بسرعة تتناقص مع استهلاك المتفاعلات. نتابع تقدمه `x` عبر الزمن بقياس مقدار يتغير (ضغط، موصلية، حجم غاز). السرعة هي ميل منحنى `x(t)` عند اللحظة المعنية.","M":["أنشئ جدول التقدم.","السرعة من ميل المماس.","`t_{1/2}` من `x_{max}/2`."],"EX":[["تركيز يتناقص من `0.40` إلى `0.25 mol/L` خلال `100 s`. احسب السرعة المتوسطة للاختفاء.","`v = 0.15/100 = 1.5×10^{-3} mol·L^{-1}·s^{-1}`."],["تفكك `0.02 mol` من الماء الأكسجيني `2H_2O_2 → 2H_2O + O_2`. أوجد `x_{max}` وحجم `O_2` (`V_m = 24 L/mol`).","`x_{max} = 0.02/2 = 0.01 mol`. `V(O_2) = 0.01 × 24 = 0.24 L`."],["كيف نعرف `t_{1/2}` من المنحنى؟","نحدد النقطة التي يبلغ فيها `x` نصف `x_{max}` ونقرأ زمنها."]],"K":"`v = (1/V)dx/dt`. `t_{1/2}`: `x = x_{max}/2`. الحرارة والتركيز والحفاز تزيد السرعة."},{"i":"⚖️","t":"التوازن الكيميائي","B":[["حالة التوازن",["جملة لا تتغير مكوناتها","تفاعلان متعاكسان بنفس السرعة","حالة ديناميكية"]],["كسر التفاعل",["`Q_r` يحسب بالتراكيز","عند التوازن `Q_{r,éq} = K`","`K` تتعلق بدرجة الحرارة فقط"]],["اتجاه التطور",["`Q_r < K`: اتجاه مباشر","`Q_r > K`: اتجاه ع {-3})^{2}/(0.1 - 1.26×10^{-3}) ≈ 1.6×10^{-5}`. `pK_a ≈ 4.8`."],["عُوير `20 mL` حمض `0.1 mol/L` بأساس `NaOH` `0.1 mol/L`. ما حجم التكافؤ؟","`c_a·V_a = c_b·V_E` فـ `V_E = 0.1 × 20/0.1 = 20 mL`."]],"K":"`pH = -log[H_3O^{+}]`. `pH = pK_a + log([A^{-}]/[AH])`. تكافؤ: `c_a V_a = c_b V_E`."},{"i":"🔌","t":"الأعمدة والتحليل الكهربائي","B":[["العمود",["مصعد: أكسدة","مهبط: إرجاع","جسر ملحي لإغلاق الدارة"]],["عمود دانيال",["`Zn → Zn^{2+} + 2e^{-}` (مصعد)","`Cu^{2+} + 2e^{-} → Cu` (مهبط)","`E ≈ 1.10 V`"]],["التحليل الكهربائي",["تفاعل قسري بمولد","مصعد: أكسدة والمهبط إرجاع","عكس العمود"]],["قانون فاراداي",["`Q = I·t`","`n(e^{-}) = Q/F`","`F = 96500 C/mol`"]],["أخطاء شائعة",["الخلط بين المصعد والمهبط","نسيان عدد الإلكترونات","`t` بغير الثواني"]]],"X":"في العمود التفاعل يحدث تلقائيا فيعطينا تيارا، وفي التحليل الكهربائي نفرض التفاعل بمولد. في الحالتين الأكسدة (خسارة إلكترونات) عند المصعد والإرجاع (كسب إلكترونات) عند المهبط. وقانون فاراداي يربط الشحنة بكمية المادة.","M":["المصعد = أكسدة، المهبط = إرجاع.","`n(e^{-}) = I·t/F`.","ثم اقسم على عدد الإلكترونات."],"EX":[["تيار `2 A` لمدة `965 s` في محلول `Cu^{2+}`. احسب كتلة النحاس المترسب (`M = 63.5 g/mol`).","`Q = 2 × 965 = 1930 C`. `n(e^{-}) = 1930/96500 = 0.02 mol`. `n(Cu) = 0.02/2 = 0.01 mol`. `m = 0.01 × 63.5 = 0.635 g`."],["اكتب نصفي المعادلة لعمود دانيال وحدد المصعد.","المصعد (أكسدة): `Zn → Zn^{2+} + 2e^{-}`. المهبط (إرجاع): `Cu^{2+} + 2e^{-} → Cu`."],["ما الفرق بين العمود والتحليل الكهربائي؟","العمود يحول طاقة كيميائية إلى كهربائية بتفاعل تلقائي. التحليل يستعمل طاقة كهربائية لفرض تفاعل غير تلقائي."]],"K":"مصعد: أكسدة. مهبط: إرجاع. `n(e^{-}) = I·t/F` مع `F = 96500 C/mol`."},{"i":"🧴","t":"الأسترة والإماهة","B":[["الأسترة",["حمض + كحول ⇌ إستر + ماء","بطيئة","محدودة (عكوسة)"]],["الإماهة",["إستر + ماء ⇌ حمض + كحول","عكس الأسترة","نفس `K`"]],["المردود",["كحول أولي: `67%` من خليط متساوي المولات","كحول ثانوي: `60%`","كحول ثالثي: `5%`"]],["تحسين المردود",["زيادة أحد المتفاعلين","نزع أحد النواتج","الحفاز يسرع ولا يغير المردود"]],["أخطاء شائع
