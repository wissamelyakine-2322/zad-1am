<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خرائط التاريخ والجغرافيا</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--fg:#1d2330;--muted:#5d6678;--line:#d9dde5}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--surface:#1a1e28;--fg:#e8ebf2;--muted:#a1a9ba;--line:#2f3544}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Segoe UI',Tahoma,'Noto Naskh Arabic',system-ui,sans-serif;line-height:1.55}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 10px 6px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tab{flex:none;border:0;border-radius:18px;padding:7px 14px;background:var(--bg);color:var(--fg);font:inherit;font-size:.9rem;cursor:pointer}
.tab.on{background:#b71c1c;color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:6px}
.chip{flex:none;border:1px solid var(--line);border-radius:14px;padding:3px 11px;background:var(--surface);color:var(--fg);font:inherit;font-size:.8rem;cursor:pointer}
.chip.on{background:#1565c0;color:#fff;border-color:#1565c0}
main{max-width:1040px;margin:0 auto;padding:12px}
.unit{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.mm{position:relative;display:grid;grid-template-columns:1fr minmax(190px,250px) 1fr;gap:26px;align-items:center;margin-top:6px}
.lines{position:absolute;inset:0;pointer-events:none;z-index:0}
.side{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.cen{position:relative;z-index:1;display:flex;justify-content:center}
.ell{background:#b71c1c;color:#fff;text-align:center;border-radius:50%;padding:30px 22px;font-weight:700;font-size:1.05rem;line-height:1.5;width:100%;box-shadow:0 2px 8px #0003}
.ell small{display:block;font-weight:400;font-size:.72rem;opacity:.9;margin-top:6px}
.br{background:var(--surface);border:2px solid var(--c);border-radius:10px;overflow:hidden}
.br h3{margin:0;padding:5px 10px;font-size:.88rem;color:#fff;background:var(--c)}
.br ul{list-style:none;margin:0;padding:6px 10px 8px}
.br li{position:relative;padding:2px 14px 2px 0;font-size:.82rem}
.br li:before{content:"";position:absolute;right:0;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--c)}
.note{margin-top:14px;background:var(--surface);border:2px solid #b71c1c;border-radius:10px;padding:8px 12px;position:relative}
.note b{display:inline-block;background:#b71c1c;color:#fff;border-radius:8px;padding:0 10px;margin-left:8px;font-size:.85rem}
.note.d{border-color:#6a1b9a}.note.d b{background:#6a1b9a}
@media (max-width:760px){
 .mm{grid-template-columns:1fr;gap:12px}
 .lines{display:none}
 .cen{order:-1}
 .ell{border-radius:22px;padding:16px}
}
</style>
</head>
<body>
<div class="top"><div class="tabs" id="tabs"></div><div class="chips" id="chips"></div></div>
<main id="map"></main>
<script>
const DATA=[{"n":1,"s":"h","u":"التاريخ · الوحدة 1: تطور العالم في ظل الثنائية القطبية (1945-1989)","t":"بروز الصراع وتشكل العالم","b":[["النتائج والمؤتمرات",["ضعف أوروبا وبروز أمريكا والاتحاد السوفياتي قوتين عظميين","مؤتمر يالطا (4-11 فيفري 1945)","مؤتمر بوتسدام (17 جويلية - 2 أوت 1945)","تأسيس الأمم المتحدة (24 أكتوبر 1945)"]],["الصراع الأيديولوجي",["الغربي: ليبرالية رأسمالية بقيادة أمريكا","الشرقي: اشتراكية شيوعية بقيادة الاتحاد السوفياتي"]],["مظاهر الصراع الغربي",["مبدأ ترومان (12 مارس 1947): احتواء المد الشيوعي بالمساعدات","مشروع مارشال (5 جوان 1947): إعمار أوروبا الغربية اقتصاديا","حلف الناتو (4 أفريل 1949)"]],["الرد السوفياتي",["مبدأ جدانوف (سبتمبر 1947)","الكومنفورم (سبتمبر 1947): مكتب الإعلام الشيوعي","الكوميكون (جانفي 1949): مجلس التعاون الاقتصادي","حلف وارسو (14 ماي 1955)"]],["مفهوم الحرب الباردة",["صراع غير مباشر دون مواجهة عسكرية مباشرة","سباق تسلح ودعاية وأزمات وحروب بالوكالة"]],["مصطلحات",["الحرب الباردة: عداء وتوتر دون قتال مباشر","سياسة الاحتواء: منع انتشار الشيوعية","الثنائية القطبية: عالم تتحكم فيه قوتان عظميان"]]],"d":"1945 يالطا وبوتسدام والأمم المتحدة · 12 مارس 1947 ترومان · 5 جوان 1947 مارشال · 4 أفريل 1949 الناتو · 14 ماي 1955 وارسو","m":"الثنائية القطبية = قوتان عظميان (أمريكا والسوفيات) وصراع غير مباشر هو الحرب الباردة."},{"n":2,"s":"h","u":"التاريخ · الوحدة 1: تطور العالم في ظل الثنائية القطبية (1945-1989)","t":"الأزمات الدولية في ظل الصراع","b":[["أزمة برلين",["حصار برلين الغربية (24 جوان 1948 - 12 ماي 1949)","الجسر الجوي الغربي","تقسيم ألمانيا إلى جمهوريتين (1949)","بناء جدار برلين (13 أوت 1961)"]],["الحرب الكورية",["25 جوان 1950 - 27 جويلية 1953","انقسام كوريا عند خط العرض 38","تدخل الطرفين ثم هدنة دون سلام"]],["أزمة السويس",["تأميم قناة السويس (26 جويلية 1956)","العدوان الثلاثي: بريطانيا وفرنسا وإسرائيل","فشله بموقف أمريكي سوفياتي مشترك"]],["أزمة الصواريخ الكوبية",["أكتوبر 1962","صواريخ سوفياتية في كوبا وحصار أمريكي","تسوية بين كينيدي وخروتشوف"]],["حرب فيتنام",["1955-1975","تدخل أمريكي مباشر ضد الشمال الشيوعي","اتفاق باريس (27 جانفي 1973) وانسحاب أمريكا"]],["النتائج",["اقتراب العالم من حرب نووية: توازن الرعب","البحث عن الانفراج وتخفيف التوتر"]]],"d":"1948-1949 حصار برلين · 1950-1953 كوريا · 1956 السويس · 13 أوت 1961 الجدار · أكتوبر 1962 كوبا · 27 جانفي 1973 اتفاق باريس","m":"برلين 1948 - كوريا 1950 - السويس 1956 - كوبا 1962 - فيتنام 1955/1975: أزمات بلا مواجهة مباشرة."},{"n":3,"s":"h","u":"التاريخ · الوحدة 1: تطور العالم في ظل الثنائية القطبية (1945-1989)","t":"مساعي الانفراج الدولي","b":[["أسباب الانفراج",["كلفة سباق التسلح الباهظة وتوازن الرعب النووي","ظهور قوى جديدة (أوروبا واليابان والصين) وحركة عدم الانحياز","التعايش السلمي منذ خروتشوف (المؤتمر العشرون، فيفري 1956)"]],["مظاهر الانفراج",["الخط الساخن بين واشنطن وموسكو (20 جوان 1963)","حظر التجارب النووية الجزئي (5 أوت 1963)","معاهدة عدم انتشار الأسلحة النووية (1 جويلية 1968)"]],["اتفاقيات وقمم",["سالت 1 (26 ماي 1972)","سالت 2 (18 جوان 1979)","مؤتمر هلسنكي للأمن والتعاون في أوروبا (1 أوت 1975)"]],["نهاية الانفراج",["الغزو السوفياتي لأفغانستان (ديسمبر 1979)","مبادرة الدفاع الاستراتيجي «حرب النجوم» (23 مارس 1983) في عهد ريغان","عودة التوتر"]],["مصطلحات",["التعايش السلمي: قبول التنافس بين النظامين دون حرب","سالت: مفاوضات الحد من الأسلحة الاستراتيجية"]]],"d":"فيفري 1956 التعايش · 20 جوان 1963 الخط الساخن · 1 جويلية 1968 منع الانتشار · 26 ماي 1972 سالت 1 · 1 أوت 1975 هلسنكي · 18 جوان 1979 سالت 2 · ديسمبر 1979 أفغانستان","m":"الانفراج = خط ساخن + اتفاقيات تسلح + تعايش سلمي، وانتهى بغزو أفغانستان 1979."},{"n":4,"s":"h","u":"التاريخ · الوحدة 1: تطور العالم في ظل الثنائية القطبية (1945-1989)","t":"من الثنائية إلى الأحادية القطبية","b":[["العوامل",["أزمة الاتحاد السوفياتي الاقتصادية","كلفة سباق التسلح وحرب أفغانستان"]],["إصلاحات غورباتشوف",["الحكم منذ 11 مارس 1985","البيريسترويكا: إعادة البناء","الغلاسنوست: الشفافية"]],["مراحل الانهيار",["معاهدة تصفية الصواريخ المتوسطة المدى (8 ديسمبر 1987)","سقوط جدار برلين (9 نوفمبر 1989)","توحيد ألمانيا (3 أكتوبر 1990)","حل حلف وارسو (1 جويلية 1991)"]],["تفكك الاتحاد السوفياتي",["رابطة الدول المستقلة (8 ديسمبر 1991)" const COL=["#c62828","#1565c0","#2e7d32","#ef6c00","#6a1b9a","#00838f","#ad1457","#8d6e00"];
const TABS=[["h","🗺️ التاريخ"],["g","🗺️ الجغرافيا"],["t","🗺️ المصطلحات"],["d","🗺️ التواريخ"]].filter(function(t){return DATA.some(function(x){return x.s===t[0]})});
let sub="h",cur=null;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function card(b,i){return `<div class="br" style="--c:${COL[i%COL.length]}"><h3>${esc(b[0])}</h3><ul>${b[1].map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`}
function render(){
 $("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===sub?"on":""}" data-k="${k}">${l}</button>`).join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{sub=b.dataset.k;cur=null;render()});
 const L=DATA.filter(x=>x.s===sub);
 if(!cur||!L.find(x=>x.n===cur))cur=L[0].n;
 $("chips").innerHTML=L.map(x=>`<button class="chip ${x.n===cur?"on":""}" data-n="${x.n}">${x.n}. ${esc(x.t.length>24?x.t.slice(0,24)+"…":x.t)}</button>`).join("");
 $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.n;render()});
 const x=L.find(y=>y.n===cur),k=Math.ceil(x.b.length/2);
 $("map").innerHTML=`<div class="unit">${esc(x.u)}</div><div class="mm" id="mm"><svg class="lines" id="ln"></svg>`+
  `<div class="side">${x.b.slice(0,k).map((b,i)=>card(b,i)).join("")}</div>`+
  `<div class="cen"><div class="ell" id="ell">${esc(x.t)}<small>الدرس ${String(x.n).padStart(2,"0")}</small></div></div>`+
  `<div class="side">${x.b.slice(k).map((b,i)=>card(b,i+k)).join("")}</div></div>`+
  (x.d?`<div class="note d"><b>أهم التواريخ والمعالم</b>${esc(x.d)}</div>`:"")+
  (x.m?`<div class="note"><b>للحفظ</b>${esc(x.m)}</div>`:"");
 window.scrollTo(0,0);requestAnimationFrame(draw)}
function draw(){
 const mm=$("mm"),svg=$("ln");if(!mm||!svg)return;
 if(innerWidth<=760){svg.innerHTML="";return}
 const R=mm.getBoundingClientRect(),e=$("ell").getBoundingClientRect();
 const cx=e.left+e.width/2-R.left,cy=e.top+e.height/2-R.top,rx=e.width/2;
 svg.setAttribute("width",R.width);svg.setAttribute("height",R.height);
 let p="";
 mm.querySelectorAll(".br").forEach(c=>{
  const r=c.getBoundingClientRect(),right=r.left+r.width/2-R.left>cx;
  const x1=cx+(right?rx:-rx),x2=right?r.left-R.left:r.right-R.left,y=r.top-R.top+14,m=(x1+x2)/2;
  p+=`<path d="M${x1} ${cy} C${m} ${cy} ${m} ${y} ${x2} ${y}" stroke="${getComputedStyle(c).getPropertyValue("--c")}" stroke-width="3" fill="none" stroke-linecap="round"/>`});
 svg.innerHTML=p}
addEventListener("resize",draw);
render();
</script>
