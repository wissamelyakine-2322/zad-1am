<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZAD AM</title>
<style>
:root{--bg1:#1e3a8a;--bg2:#7c3aed;--card:#ffffff;--ink:#1a2332;--acc:#fbbf24;--ok:#10b981;--danger:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;min-height:100vh;color:#fff;
 background:linear-gradient(160deg,var(--bg1),var(--bg2));padding:env(safe-area-inset-top) 16px 24px}
header{text-align:center;padding:20px 0 6px;position:relative}
header img{width:80px;height:80px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
h1{margin:10px 0 2px;font-size:25px;letter-spacing:1px}
.sub{opacity:.85;font-size:13px;margin:0 0 6px}
.trialbar{max-width:520px;margin:0 auto 14px;background:rgba(255,255,255,.14);border-radius:14px;padding:8px 14px;font-size:13px;text-align:center}
.trialbar.warn{background:rgba(239,68,68,.35)}
.actbtn{position:absolute;left:0;top:18px;background:var(--acc);color:var(--ink);border:0;border-radius:12px;padding:6px 10px;font-size:18px;cursor:pointer}

.grid{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:auto;min-height:75vh;justify-content:center}
.lv{position:relative;border:0;border-radius:26px;padding:0;overflow:hidden;background:none;cursor:pointer;
 width:100%;min-height:18vh;box-shadow:0 10px 26px rgba(0,0,0,.4);transition:transform .15s}
.lv:active{transform:scale(.97)}
.lv img{width:100%;height:100%;object-fit:cover;display:block}
.lv span{position:absolute;bottom:12px;right:14px;background:var(--acc);color:var(--ink);font-size:15px;font-weight:bold;border-radius:20px;padding:4px 14px}

#view,#subjectView,#chat,#actScreen,#webview{display:none;max-width:720px;margin:auto}
#webview.show{display:flex;position:fixed;inset:0;max-width:100%;z-index:40;flex-direction:column;background:#fff}
#webview .wvTop{display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top) 10px 8px;background:var(--bg1);color:#fff}
#webview .wvTop button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px}
#webview .wvTop span{flex:1;font-size:13px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#webview iframe{flex:1;border:0;width:100%}
.top{display:flex;align-items:center;gap:10px;margin:14px 0}
.top button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer}
.top h2{margin:0;font-size:19px;flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chips button{flex:none;border:0;border-radius:20px;padding:8px 14px;font-size:14px;background:rgba(255,255,255,.18);color:#fff;font-family:inherit;cursor:pointer}
.chips button.on{background:var(--acc);color:var(--ink);font-weight:bold}
#q{width:100%;padding:12px 14px;border-radius:14px;border:0;font-size:16px;margin-bottom:6px;font-family:inherit}
.sec{margin-top:20px}
.sec h3{margin:0 0 8px;font-size:17px;border-right:5px solid var(--acc);padding-right:10px}
.card{background:var(--card);border-radius:16px;padding:6px 14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card a{display:flex;gap:10px;align-items:center;color:#1a56a0;text-decoration:none;font-weight:bold;font-size:16px;padding:11px 0;border-bottom:1px solid #eef1f6}
.card a:last-child{border-bottom:0}

/* subjects grid inside a level */
.subjgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.subj{background:var(--card);color:var(--ink);border-radius:18px;padding:16px 10px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;border:0;font-family:inherit}
.subj .ic{font-size:30px;display:block;margin-bottom:6px}
.subj .name{font-weight:bold;font-size:14px}
.subj .btnrow{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.subj .btnrow button{background:var(--bg2);color:#fff;border:0;border-radius:10px;padding:6px 8px;font-size:12px;width:100%;font-family:inherit}
.subj .btnrow button.quizbtn{background:#059669}
.subj .btnrow button.explainbtn{background:#7c3aed}

#quiz{display:none}
#quiz.show{display:block;position:fixed;inset:0;z-index:45;background:linear-gradient(160deg,var(--bg1),var(--bg2));
 padding:env(safe-area-inset-top) 16px 20px;overflow-y:auto}
.qTop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qTop button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:12px;padding:8px 12px}
.qCard{background:var(--card);color:var(--ink);border-radius:16px;padding:16px;margin-bottom:14px}
.qCard .qtext{font-weight:bold;margin-bottom:10px}
.qCard label{display:block;background:#f3f4f6;border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}
.qCard label.correct{background:#bbf7d0}
.qCard label.wrong{background:#fecaca}
.qSubmit{width:100%;background:var(--acc);color:var(--ink);border:0;border-radius:14px;padding:13px;font-weight:bold;font-size:16px;margin-top:6px}
.qScore{text-align:center;font-size:18px;font-weight:bold;margin:10px 0}
.topicBox{max-width:420px;margin:50px auto 0;background:rgba(255,255,255,.14);border-radius:18px;padding:22px;text-align:center}
.topicBox input{width:100%;padding:12px;border-radius:12px;border:0;font-size:16px;margin:12px 0;font-family:inherit}
.topicBox button{width:100%;background:var(--acc);color:var(--ink);border:0;border-radius:14px;padding:13px;font-weight:bold}
.loadingDots{text-align:center;padding:30px;font-size:15px;opacity:.85}

/* chat */
#chat{display:none;flex-direction:column;height:calc(100vh - 20px)}
#chat.show{display:flex}
.chatTop{display:flex;align-items:center;gap:10px;padding:10px 4px}
.chatTop button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:12px;padding:8px 12px}
.chatTop h2{margin:0;font-size:16px;flex:1}
#msgs{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.7}
.msg.user{align-self:flex-start;background:var(--acc);color:var(--ink);border-bottom-left-radius:4px}
.msg.bot{align-self:flex-end;background:var(--card);color:var(--ink);border-bottom-right-radius:4px}
.chatIn{display:flex;gap:8px;padding:8px 0 4px}
.chatIn input{flex:1;border:0;border-radius:14px;padding:12px 14px;font-size:15px;font-family:inherit}
.chatIn button{background:var(--acc);color:var(--ink);border:0;border-radius:14px;padding:0 18px;font-weight:bold}
.typing{align-self:flex-end;font-size:13px;opacity:.8;background:var(--card);color:var(--ink);padding:6px 12px;border-radius:12px}

/* activation overlay */
#actScreen.show{display:block;position:fixed;inset:0;background:linear-gradient(160deg,var(--bg1),var(--bg2));z-index:50;
 padding:env(safe-area-inset-top) 20px 24px;overflow-y:auto}
.actbox{max-width:420px;margin:60px auto 0;background:rgba(255,255,255,.12);border-radius:20px;padding:24px;text-align:center}
.actbox h2{margin:0 0 6px}
.actbox p{opacity:.9;line-height:1.8;font-size:14px}
.deviceCode{background:rgba(0,0,0,.25);border-radius:12px;padding:12px;font-size:20px;letter-spacing:3px;margin:14px 0;direction:ltr}
.actbox input{width:100%;padding:12px;border-radius:12px;border:0;font-size:16px;margin:10px 0;text-align:center;direction:ltr;font-family:inherit}
.actbox button{width:100%;background:var(--acc);color:var(--ink);border:0;border-radius:14px;padding:13px;font-weight:bold;font-size:16px;margin-top:6px}
.actMsg{font-size:13px;margin-top:10px;min-height:18px}
.actMsg.err{color:#fecaca}
.actMsg.ok{color:#bbf7d0}

.empty{background:rgba(255,255,255,.14);border-radius:16px;padding:22px;text-align:center;line-height:1.9}
.note{font-size:12px;opacity:.8;text-align:center;margin-top:22px;line-height:1.7}
</style>
</head>
<body>

<!-- ===================== شاشة التفعيل (تظهر فوق كل شيء عند الحاجة) ===================== -->
<div id="actScreen">
  <div class="actbox">
    <h2>🔒 انتهت الفترة المجانية</h2>
    <p>انتهت الفترة المجانية لتطبيق ZAD AM في 18 ديسمبر 2026.<br>للمتابعة، أرسلي رمز الجهاز التالي إلى البائع للحصول على مفتاح التفعيل.</p>
    <div class="deviceCode" id="deviceCodeShow">------------</div>
    <input id="licenseInput" placeholder="أدخلي مفتاح التفعيل هنا" maxlength="19">
    <button onclick="tryActivate()">تفعيل</button>
    <div class="actMsg" id="actMsg"></div>
  </div>
</div>

<!-- ===================== الشاشة الرئيسية: اختيار السنة ===================== -->
<header>
  <button class="actbtn" id="actIcon" onclick="showActivation()" title="التفعيل">🔑</button>
  <h1>ZAD AM</h1>
  <p class="sub">اختاري المستوى الدراسي</p>
</header>
<div class="trialbar" id="trialBar"></div>

<div class="grid" id="home"></div>

<!-- ===================== شاشة المستوى: المواد + الروابط ===================== -->
<div id="view">
  <div class="top"><button onclick="goHome()">→ رجوع</button><h2 id="vt"></h2></div>

  <div class="subjgrid" id="subjGrid"></div>

  <div class="chips" id="chips"></div>
  <input id="q" type="search" placeholder="🔍 ابحثي في الروابط (رياضيات، فيزياء...)">
  <div id="secs"></div>
</div>

<p class="note" id="foot"></p>

<!-- ===================== شاشة الدردشة مع الأستاذ الذكي ===================== -->
<div id="chat">
  <div class="chatTop"><button onclick="closeChat()">→ رجوع</button><h2 id="chatTitle"></h2></div>
  <div id="msgs"></div>
  <div class="chatIn">
    <input id="chatInput" placeholder="اكتبي سؤالك هنا..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()">إرسال</button>
  </div>
</div>

<!-- ===================== شاشة الشرح (📖) وشاشة الكويز (📝) ===================== -->
<div id="quiz">
  <div class="qTop"><button onclick="closeQuiz()">→ رجوع</button><h2 id="quizTitle" style="margin:0;font-size:17px;flex:1"></h2></div>
  <div id="quizBody"></div>
</div>

<div id="webview">
  <div class="wvTop"><button onclick="closeWebview()">✕ إغلاق</button><span id="wvTitle"></span><button onclick="openExternal()">↗ فتح خارجي</button></div>
  <iframe id="wvFrame"></iframe>
</div>

<script src="db.js"></script>
<script>
/* ============================================================
   إعدادات عامة — عدّلي القيم هنا فقط
   ============================================================ */
const CONFIG = {
  TRIAL_END: new Date('2026-12-18T23:59:59'),   // نهاية الفترة المجانية
  GEMINI_API_KEY: '',                            // ضعي مفتاح Gemini هنا بعد الحصول عليه من aistudio.google.com
  GEMINI_MODEL: 'gemini-2.5-flash',
  LICENSE_SECRET: 'ZADAM-2026-SECRET'            // سر توليد مفاتيح التفعيل (يجب أن يطابق أداة المدير الخاصة بالبائع)
};

/* ============================================================
   شخصيات "الأستاذ الذكي" لكل مادة — نفس المواد لكل المستويات
   ============================================================ */
const SUBJECTS = [
  {key:'math',  name:'الرياضيات',          icon:'➕', prompt:'أنت أستاذ رياضيات جزائري متخصص في مناهج التعليم المتوسط. اشرح بأسلوب مبسط جداً، بخطوات مرقمة، وبالدارجة العلمية المدرسية الجزائرية. لا تجب أبداً عن أي سؤال خارج مادة الرياضيات — إذا سُئلت عن مادة أخرى، اعتذري بلطف واطلبي من التلميذ فتح أستاذ تلك المادة.'},
  {key:'phys',  name:'الفيزياء والتكنولوجيا', icon:'⚡', prompt:'أنت أستاذ فيزياء وتكنولوجيا جزائري للتعليم المتوسط. اشرح المفاهيم بتجارب وأمثلة من الحياة اليومية، وبسّطي المعادلات خطوة بخطوة. لا تجب إطلاقاً عن أسئلة خارج مادتك.'},
  {key:'sci',   name:'علوم الطبيعة والحياة', icon:'🌿', prompt:'أنت أستاذة علوم طبيعة وحياة جزائرية للتعليم المتوسط. اشرحي بأسلوب وصفي مبسط مع أمثلة من جسم الإنسان والبيئة. لا تجيبي عن أي سؤال خارج مادتك.'},
  {key:'ar',    name:'اللغة العربية',        icon:'📗', prompt:'أنت أستاذ لغة عربية جزائري للتعليم المتوسط، متخصص في القواعد والنحو والتعبير الكتابي. اشرح بأمثلة معربة وبسيطة. لا تجب عن أي سؤال خارج مادتك.'},
  {key:'hist',  name:'التاريخ والجغرافيا',   icon:'🗺️', prompt:'أنت أستاذ تاريخ وجغرافيا جزائري للتعليم المتوسط. اشرح الأحداث بترتيب زمني وبخرائط ذهنية بسيطة. لا تجب عن أي سؤال خارج مادتك.'},
  {key:'fr',    name:'الفرنسية',             icon:'🇫🇷', prompt:"Tu es un professeur de français algérien pour le cycle moyen. Explique en français simple avec traduction arabe des mots difficiles. Ne réponds à aucune question en dehors de ta matière."},
  {key:'en',    name:'الإنجليزية',           icon:'🇬🇧', prompt:'You are an Algerian English teacher for middle school. Explain simply in English with Arabic clarification for hard words. Never answer anything outside English lessons.'},
  {key:'islam', name:'التربية الإسلامية',     icon:'🕌', prompt:'أنت أستاذ تربية إسلامية جزائري للتعليم المتوسط. اشرح بأسلوب هادئ مدعوم بالأدلة الشرعية المبسطة المناسبة للمنهاج فقط. لا تجب عن أي سؤال خارج مادتك.'},
  {key:'civic', name:'التربية المدنية',      icon:'⚖️', prompt:'أنت أستاذ تربية مدنية جزائري للتعليم المتوسط. اشرح مفاهيم المواطنة والحقوق والواجبات بأمثلة من الحياة اليومية للتلميذ. لا تجب عن أي سؤال خارج مادتك.'}
];

const $ = id => document.getElementById(id);
let cur = null, cat = 'all', curSubject = null, chatHistory = [];
const CATS=[['all','الكل'],['books','📚 كتب'],['exercises','✏️ تمارين'],['notes','📝 مذكرات الأستاذ'],['exams','🧪 فروض واختبارات']];

/* ============================================================
   نظام التفعيل والفترة المجانية
   ============================================================ */
function getDeviceCode(){
  let c = localStorage.getItem('zadam_device');
  if(!c){
    c = Array.from({length:12},()=>Math.floor(Math.random()*10)).join('');
    localStorage.setItem('zadam_device', c);
  }
  return c;
}
function formatCode(c){ return c.match(/.{1,4}/g).join('-'); }

// خوارزمية بسيطة لتوليد/التحقق من مفتاح مطابق لرمز الجهاز (يجب أن تُستعمل نفس الدالة في أداة المدير)
function expectedLicense(deviceCode){
  let hash = 0;
  const s = deviceCode + CONFIG.LICENSE_SECRET;
  for(let i=0;i<s.length;i++){ hash = (hash*31 + s.charCodeAt(i)) >>> 0; }
  let key = hash.toString(36).toUpperCase().padStart(10,'0').slice(0,10);
  return key.match(/.{1,5}/g).join('-');
}
function isActivated(){ return localStorage.getItem('zadam_licensed') === 'true'; }
function isTrialActive(){ return new Date() <= CONFIG.TRIAL_END; }
function isLocked(){ return !isTrialActive() && !isActivated(); }

function tryActivate(){
  const input = $('licenseInput').value.trim().toUpperCase();
  const expected = expectedLicense(getDeviceCode());
  const msg = $('actMsg');
  if(input === expected){
    localStorage.setItem('zadam_licensed','true');
    msg.textContent = '✅ تم التفعيل بنجاح!'; msg.className='actMsg ok';
    setTimeout(()=>{ $('actScreen').classList.remove('show'); renderTrialBar(); },900);
  } else {
    msg.textContent = '❌ المفتاح غير صحيح، تأكدي من رمز الجهاز.'; msg.className='actMsg err';
  }
}
function showActivation(){
  $('deviceCodeShow').textContent = formatCode(getDeviceCode());
  $('actScreen').classList.add('show');
}
function renderTrialBar(){
  const bar = $('trialBar');
  if(isActivated()){ bar.textContent = '✅ التطبيق مُفعّل بالكامل'; bar.className='trialbar'; return; }
  if(isTrialActive()){
    const days = Math.ceil((CONFIG.TRIAL_END - new Date())/86400000);
    bar.textContent = `🎁 نسخة مجانية — تبقّى ${days} يوماً (حتى 18 ديسمبر 2026)`;
    bar.className='trialbar';
  } else {
    bar.textContent = '⛔ انتهت الفترة المجانية — اضغطي 🔑 أعلاه للتفعيل';
    bar.className='trialbar warn';
    showActivation();
  }
}

/* ============================================================
   الشاشة الرئيسية والمستويات
   ============================================================ */
function renderHome(){
  $('home').innerHTML = Object.entries(DB.levels).map(([k,l]) =>
    `<button class="lv" onclick="openLevel('${k}')">
       <img src="img/${k.toLowerCase()}.png" alt="${k}">
       <span>${l.sections.reduce((n,s)=>n+s.links.length,0)} رابط</span>
     </button>`).join('');
  $('foot').textContent = 'قاعدة البيانات: موسم ' + DB.season + ' • الإصدار ' + DB.version;
}
function openLevel(k){
  if(isLocked()){ showActivation(); return; }
  cur = k; const l = DB.levels[k];
  $('home').style.display='none'; document.querySelector('.sub').style.display='none'; $('trialBar').style.display='none';
  $('view').style.display='block'; $('vt').textContent = k + ' — ' + l.name;
  renderSubjects(); $('q').value=''; cat='all'; renderChips(); renderSecs();
  window.scrollTo(0,0);
}
function goHome(){
  $('view').style.display='none'; $('home').style.display='grid';
  document.querySelector('.sub').style.display='block'; $('trialBar').style.display='block';
}
function renderChips(){ $('chips').innerHTML = CATS.map(([k,n])=>`<button class="${k===cat?'on':''}" onclick="cat='${k}';renderChips();renderSecs()">${n}</button>`).join(''); }
function renderSecs(){
  const l = DB.levels[cur], q = $('q').value.trim().toLowerCase();
  const out = l.sections.map(s => {
    if(cat!=='all' && s.cat!==cat) return '';
    const links = s.links.filter(x => !q || (x.label + ' ' + s.title).toLowerCase().includes(q));
    if(!links.length) return '';
    return `<div class="sec"><h3>${s.title}</h3><div class="card">` +
      links.map(x => `<a href="#" onclick="openWebview('${x.url.replace(/'/g,"\\'")}','${x.label.replace(/'/g,"\\'")}');return false;"><i>${x.icon}</i><span>${x.label}</span></a>`).join('') +
      '</div></div>';
  }).join('');
  $('secs').innerHTML = out || '<div class="empty">لا توجد نتائج مطابقة.</div>';
}
$('q').addEventListener('input', renderSecs);

/* ============================================================
   عارض مدمج داخل التطبيق (بدل فتح متصفح خارجي)
   ============================================================ */
let currentExternalUrl = '';
function openWebview(url, title){
  currentExternalUrl = url;
  $('wvTitle').textContent = title;
  $('wvFrame').src = url;
  $('webview').classList.add('show');
}
function closeWebview(){
  $('webview').classList.remove('show');
  $('wvFrame').src = 'about:blank';
}
function openExternal(){
  window.open(currentExternalUrl, '_system');
}

/* ============================================================
   شبكة المواد + زر "اسأل الأستاذ الذكي"
   ============================================================ */
function renderSubjects(){
  $('subjGrid').innerHTML = SUBJECTS.map(s =>
    `<div class="subj">
       <span class="ic">${s.icon}</span>
       <span class="name">${s.name}</span>
       <div class="btnrow">
         <button onclick="openChat('${s.key}')">💬 اسأل الأستاذ</button>
         <button class="explainbtn" onclick="openExplain('${s.key}')">📖 الشرح</button>
         <button class="quizbtn" onclick="openQuiz('${s.key}')">📝 كويز</button>
       </div>
     </div>`).join('');
}

/* ============================================================
   📖 الشرح: الطالب يكتب اسم الدرس، الأستاذ يشرحه بالتفصيل
   ============================================================ */
function openExplain(subjectKey){
  if(isLocked()){ showActivation(); return; }
  const subject = SUBJECTS.find(s=>s.key===subjectKey);
  $('quizTitle').textContent = '📖 شرح — ' + subject.name;
  $('quizBody').innerHTML = `
    <div class="topicBox">
      <h3 style="margin:0 0 6px">أي درس تريدين شرحه؟</h3>
      <p style="opacity:.85;font-size:13px;margin:0">اكتبي اسم الدرس أو الموضوع (مثلاً: المعادلات، الكسور، التناسبية...)</p>
      <input id="explainTopic" placeholder="اسم الدرس...">
      <button onclick="runExplain('${subjectKey}')">اشرحي لي 📖</button>
    </div>`;
  $('quiz').classList.add('show');
}
async function runExplain(subjectKey){
  const subject = SUBJECTS.find(s=>s.key===subjectKey);
  const topic = $('explainTopic').value.trim();
  if(!topic) return;
  $('quizBody').innerHTML = '<div class="loadingDots">📖 جاري إعداد الشرح...</div>';

  if(!CONFIG.GEMINI_API_KEY){
    $('quizBody').innerHTML = '<div class="empty">⚠️ لم يُضبط مفتاح الذكاء الاصطناعي بعد.</div>';
    return;
  }
  try{
    const text = await askGemini(subject, [{role:'user', text:`اشرحي لي درس "${topic}" بالتفصيل، بأسلوب مبسط جداً مناسب لتلميذ، مع مثال واحد على الأقل، وبخطوات مرقمة إن أمكن.`}]);
    $('quizBody').innerHTML = `<div class="qCard" style="line-height:1.9;white-space:pre-wrap">${escapeHtml(text)}</div>
      <button class="qSubmit" onclick="openExplain('${subjectKey}')">شرح درس آخر</button>`;
  }catch(e){
    $('quizBody').innerHTML = '<div class="empty">⚠️ تعذّر الاتصال بالأستاذ الذكي. حاولي مجدداً.</div>';
  }
}
function closeQuiz(){ $('quiz').classList.remove('show'); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ============================================================
   📝 الكويز: يولّد 5 أسئلة اختيار من متعدد عبر الذكاء الاصطناعي
   ============================================================ */
let currentQuizData = null;
function openQuiz(subjectKey){
  if(isLocked()){ showActivation(); return; }
  const subject = SUBJECTS.find(s=>s.key===subjectKey);
  $('quizTitle').textContent = '📝 كويز — ' + subject.name;
  $('quizBody').innerHTML = `
    <div class="topicBox">
      <h3 style="margin:0 0 6px">كويز في أي درس؟</h3>
      <input id="quizTopic" placeholder="اسم الدرس...">
      <button onclick="runQuiz('${subjectKey}')">ابدئي الكويز 📝</button>
    </div>`;
  $('quiz').classList.add('show');
}
async function runQuiz(subjectKey){
  const subject = SUBJECTS.find(s=>s.key===subjectKey);
  const topic = $('quizTopic').value.trim();
  if(!topic) return;
  $('quizBody').innerHTML = '<div class="loadingDots">📝 جاري إعداد الأسئلة...</div>';

  if(!CONFIG.GEMINI_API_KEY){
    $('quizBody').innerHTML = '<div class="empty">⚠️ لم يُضبط مفتاح الذكاء الاصطناعي بعد.</div>';
    return;
  }
  const prompt = `أنشئي 5 أسئلة اختيار من متعدد (4 خيارات لكل سؤال) حول درس "${topic}" في مادة ${subject.name}، مناسبة لمستوى تلميذ متوسط.
أجيبي بصيغة JSON فقط دون أي نص إضافي قبله أو بعده، بالضبط بهذا الشكل:
[{"q":"نص السؤال","options":["خيار1","خيار2","خيار3","خيار4"],"correct":0}]
حيث "correct" هو رقم فهرس الخيار الصحيح (0 إلى 3).`;

  try{
    const raw = await askGemini(subject, [{role:'user', text: prompt}]);
    const clean = raw.replace(/```json|```/g,'').trim();
    currentQuizData = JSON.parse(clean);
    renderQuiz(subjectKey);
  }catch(e){
    $('quizBody').innerHTML = '<div class="empty">⚠️ تعذّر إعداد الكويز، حاولي درساً آخر أو أعيدي المحاولة.</div>';
  }
}
function renderQuiz(subjectKey){
  $('quizBody').innerHTML = currentQuizData.map((q,i) => `
    <div class="qCard" data-qi="${i}">
      <div class="qtext">${i+1}. ${escapeHtml(q.q)}</div>
      ${q.options.map((opt,oi)=>`<label><input type="radio" name="q${i}" value="${oi}" style="margin-left:8px">${escapeHtml(opt)}</label>`).join('')}
    </div>`).join('') + `<button class="qSubmit" onclick="gradeQuiz('${subjectKey}')">تصحيح ✅</button>`;
}
function gradeQuiz(subjectKey){
  let score = 0;
  currentQuizData.forEach((q,i)=>{
    const card = document.querySelector(`.qCard[data-qi="${i}"]`);
    const chosen = card.querySelector(`input[name="q${i}"]:checked`);
    const labels = card.querySelectorAll('label');
    labels.forEach((lab,oi)=>{
      if(oi === q.correct) lab.classList.add('correct');
      else if(chosen && Number(chosen.value) === oi) lab.classList.add('wrong');
    });
    if(chosen && Number(chosen.value) === q.correct) score++;
  });
  const box = document.createElement('div');
  box.className = 'qScore';
  box.textContent = `نتيجتك: ${score} من ${currentQuizData.length} ✅`;
  $('quizBody').appendChild(box);
  const again = document.createElement('button');
  again.className = 'qSubmit'; again.textContent = 'كويز جديد';
  again.onclick = () => openQuiz(subjectKey);
  $('quizBody').appendChild(again);
  document.querySelector('.qSubmit').remove(); // إزالة زر "تصحيح" القديم
}

/* ============================================================
   الدردشة مع الأستاذ الذكي (Google Gemini API)
   ============================================================ */
function openChat(subjectKey){
  if(isLocked()){ showActivation(); return; }
  curSubject = SUBJECTS.find(s=>s.key===subjectKey);
  chatHistory = [];
  $('chatTitle').textContent = '🤖 أستاذ ' + curSubject.name;
  $('msgs').innerHTML = '';
  addMsg('bot', `أهلاً بك! أنا أستاذك الذكي في مادة ${curSubject.name} (${cur}). اسألني عن أي درس، أو أرسل لي تمريناً لأشرح لك طريقة حله خطوة بخطوة.`);
  $('chat').classList.add('show');
}
function closeChat(){ $('chat').classList.remove('show'); }
function addMsg(who, text){
  const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text;
  $('msgs').appendChild(d); $('msgs').scrollTop = $('msgs').scrollHeight;
}
async function sendMsg(){
  const input = $('chatInput'); const text = input.value.trim();
  if(!text) return;
  addMsg('user', text); input.value='';
  chatHistory.push({role:'user', text});

  if(!CONFIG.GEMINI_API_KEY){
    addMsg('bot', '⚠️ لم يُضبط مفتاح الذكاء الاصطناعي بعد. يرجى إضافة مفتاح Gemini في إعدادات التطبيق (CONFIG.GEMINI_API_KEY) ليعمل الأستاذ الذكي.');
    return;
  }
  const typing = document.createElement('div'); typing.className='typing'; typing.textContent='الأستاذ يكتب...';
  $('msgs').appendChild(typing); $('msgs').scrollTop = $('msgs').scrollHeight;

  try{
    const reply = await askGemini(curSubject, chatHistory);
    typing.remove();
    addMsg('bot', reply);
    chatHistory.push({role:'model', text:reply});
  }catch(e){
    typing.remove();
    addMsg('bot', '⚠️ تعذّر الاتصال بالأستاذ الذكي الآن. تأكدي من الإنترنت وحاولي مجدداً. (' + e.message + ')');
  }
}
async function askGemini(subject, history){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.GEMINI_MODEL}:generateContent?key=${CONFIG.GEMINI_API_KEY}`;
  const contents = history.map(h => ({ role: h.role==='user'?'user':'model', parts:[{text:h.text}] }));
  const body = {
    system_instruction: { parts:[{ text: subject.prompt }] },
    contents
  };
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return data?.candidates?.[0]?.content?.parts?.[0]?.text || 'لم يصل رد واضح، أعيدي صياغة السؤال من فضلك.';
}

/* ============================================================
   بدء التشغيل
   ============================================================ */
renderHome();
renderTrialBar();
if(isLocked()) showActivation();
</script>
